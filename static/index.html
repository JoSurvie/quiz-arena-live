        function loadShareLogo() {
          const trySrc = (src, useCors) => new Promise(resolve => {
            const img = new Image();
            if (useCors) img.crossOrigin = "anonymous";
            img.onload = () => resolve(img.naturalWidth > 0 ? img : null);
            img.onerror = () => resolve(null);
            img.src = src;
          });
          return trySrc("/api/logo", false).then(img => img || trySrc(LOGO_URL, true));
        }

        async function makeShareCardBlob() {
          const logoImg = await loadShareLogo();
          const canvas = document.createElement("canvas");
          canvas.width = 1080;
          canvas.height = 1350;
          const ctx = canvas.getContext("2d");
          const grad = ctx.createLinearGradient(0, 0, 1080, 1350);
          grad.addColorStop(0, "#4c1d95");
          grad.addColorStop(0.5, "#1e1b4b");
          grad.addColorStop(1, "#0f0a2e");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 1080, 1350);

          ctx.textAlign = "center";
          if (logoImg) {
            const scale = Math.min(460 / logoImg.naturalWidth, 115 / logoImg.naturalHeight);
            const drawW = logoImg.naturalWidth * scale;
            const drawH = logoImg.naturalHeight * scale;
            ctx.drawImage(logoImg, (1080 - drawW) / 2, 42 + (115 - drawH) / 2, drawW, drawH);

            ctx.fillStyle = "#ffffff";
            ctx.font = "900 58px system-ui, sans-serif";
            ctx.fillText("LASER QUIZ", 540, 212);
            ctx.fillStyle = "#fcd34d";
            ctx.font = "700 32px system-ui, sans-serif";
            ctx.fillText(`${catIcon(s.category)} ${s.category} · ${s.difficulty === "debutant" ? "Débutant" : "Standard"}`, 540, 266);

            ctx.font = "155px system-ui, sans-serif";
            ctx.fillText(medal, 540, 465);

            ctx.fillStyle = "#ffffff";
            ctx.font = "900 64px system-ui, sans-serif";
            ctx.fillText(`${s.avatar} ${s.name}`, 540, 580);
          } else {
            ctx.fillStyle = "#ffffff";
            ctx.font = "900 68px system-ui, sans-serif";
            ctx.fillText("LASER QUIZ", 540, 145);
            ctx.fillStyle = "#fcd34d";
            ctx.font = "700 32px system-ui, sans-serif";
            ctx.fillText(`${catIcon(s.category)} ${s.category} · ${s.difficulty === "debutant" ? "Débutant" : "Standard"}`, 540, 210);

            ctx.font = "170px system-ui, sans-serif";
            ctx.fillText(medal, 540, 440);

            ctx.fillStyle = "#ffffff";
            ctx.font = "900 64px system-ui, sans-serif";
            ctx.fillText(`${s.avatar} ${s.name}`, 540, 565);
          }

          ctx.fillStyle = "#fcd34d";
          ctx.font = "900 130px system-ui, sans-serif";
          ctx.fillText(`${rankLabel}`, 540, 745);
          ctx.fillStyle = "rgba(255,255,255,0.75)";
          ctx.font = "600 38px system-ui, sans-serif";
          ctx.fillText(`sur ${s.players_count} joueur(s)`, 540, 805);

          ctx.fillStyle = "rgba(255,255,255,0.12)";
          ctx.fillRect(190, 865, 700, 140);
          ctx.fillStyle = "#ffffff";
          ctx.font = "900 76px system-ui, sans-serif";
          ctx.fillText(`${s.score} pts`, 540, 960);

          const badgeLine = badges.slice(0, 4).map(b => `${b.icon} ${b.label}`).join("   ");
          ctx.fillStyle = "#a7f3d0";
          ctx.font = "700 32px system-ui, sans-serif";
          ctx.fillText(badgeLine || "Laser Game Evolution", 540, 1110);

          ctx.fillStyle = "rgba(255,255,255,0.55)";
          ctx.font = "600 28px system-ui, sans-serif";
          ctx.fillText(shareUrl, 540, 1255);
          return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        }

        main.querySelectorAll(".share-link-btn").forEach(a => {
          a.onclick = () => sendMsg({ type: "SHARE", channel: a.dataset.share });
        });
        $("share-copy").onclick = async () => {
          try {
            await navigator.clipboard.writeText(`${shareText} ${shareUrl}`);
            sendMsg({ type: "SHARE", channel: "copy" });
            setText("share-feedback", "✅ Texte copié !");
          } catch (_) {
            setText("share-feedback", "Copie impossible sur cet appareil.");
          }
        };
        $("share-native").onclick = async () => {
          try {
            const blob = await makeShareCardBlob();
            const file = blob ? new File([blob], "laser-quiz-score.png", { type: "image/png" }) : null;
            if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({ title: "Laser Quiz", text: shareText, files: [file] });
              sendMsg({ type: "SHARE", channel: "native" });
              setText("share-feedback", "✅ Carte partagée !");
              return;
            }
            if (navigator.share) {
              await navigator.share({ title: "Laser Quiz", text: shareText, url: shareUrl });
              sendMsg({ type: "SHARE", channel: "native" });
              setText("share-feedback", "✅ Score partagé !");
              return;
            }
            if (blob) {
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = "laser-quiz-score.png";
              a.click();
              sendMsg({ type: "SHARE", channel: "native" });
              setText("share-feedback", "📥 Image téléchargée !");
            }
          } catch (_) {}
        };

        bindBeginnerToggle();
        bindVoteButtons(main, (cat) => sendMsg({ type: "VOTE", category: cat }));
        const k = `${s.category}|${s.q_total}|${s.score}`;
        if (s.rank && s.rank <= 3 && typeof confetti === "function" && celebrated !== k) {
          celebrated = k;
          confetti({ particleCount: 150, spread: 90, origin: { y: 0.7 } });
        }
      }
    }
  }

      async function doAdminMobileLogin() {
        setText("ma-err", "");
        if (pendingToken) {
          const new_password = $("ma-new").value || "";
          const conf = $("ma-conf").value || "";
          if (new_password !== conf) { setText("ma-err", "Les deux mots de passe ne correspondent pas."); return; }
          if (new_password.trim().length < 4) { setText("ma-err", "Minimum 4 caractères requis."); return; }
          try {
            const r = await fetch("/api/auth/change-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: pendingToken, new_password }),
            });
            const d = await r.json();
            if (!r.ok || !d.ok) { setText("ma-err", d.detail || "Erreur"); return; }
            renderMobileRegie(roomCode, d.token);
          } catch (e) { setText("ma-err", e.message || "Erreur réseau"); }
          return;
        }
        try {
          const r = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: ($("ma-user").value || "").trim(), password: $("ma-pass").value || "", target: "regie" }),
          });
          const d = await r.json();
          if (!r.ok || !d.ok) { setText("ma-err", d.detail || "Identifiant ou mot de passe incorrect."); return; }
          if (d.must_change_password) {
            pendingToken = d.change_token;
            $("ma-chg-box").classList.remove("hidden");
            setText("ma-submit", "💾 Enregistrer & Ouvrir la Régie");
            $("ma-new").focus();
            return;
          }
          renderMobileRegie(roomCode, d.token);
        } catch (e) { setText("ma-err", e.message || "Erreur réseau"); }
      }
      $("ma-submit").onclick = doAdminMobileLogin;
      $("ma-pass").onkeydown = (e) => { if (e.key === "Enter") doAdminMobileLogin(); };
      $("ma-conf").onkeydown = (e) => { if (e.key === "Enter") doAdminMobileLogin(); };
      setTimeout(() => $("ma-pass").focus(), 60);
    }

                <input id="mr-pwd-val" type="password" placeholder="Nouveau mot de passe (min. 4 car.)" class="w-full rounded-xl bg-slate-800 border border-white/15 px-3 py-2 text-xs text-white outline-none" />
                <button id="mr-pwd-save" class="w-full bg-indigo-600 active:scale-95 rounded-xl py-2 text-xs font-bold">💾 Changer le mot de passe</button>
                <div id="mr-pwd-fb" class="text-[11px] min-h-[1rem]"></div>
              </div>
            </div>
            <div class="bg-white/10 border border-white/15 rounded-2xl p-3.5 flex flex-col gap-2">
              <div class="text-xs uppercase tracking-wider font-bold opacity-80">👥 Joueurs en salle <span id="mr-pcount" class="text-amber-300"></span></div>
              <div id="mr-players" class="flex flex-col gap-1.5"></div>
            </div>
          </main>
          <footer class="shrink-0 px-4 py-2.5 border-t border-white/10 bg-slate-950/90 flex gap-2">
            <button id="mr-up-bot" class="flex-1 bg-white/15 active:scale-95 rounded-xl py-2 text-xs font-bold">⬆️ Monter</button>
            <button id="mr-down-bot" class="flex-1 bg-white/15 active:scale-95 rounded-xl py-2 text-xs font-bold">⬇️ Descendre</button>
          </footer>
        </div>`;

      function scrollMobileRegie(delta) {
        const body = $("mr-body");
        if (!body) return;
        try { body.scrollBy({ top: delta, behavior: "smooth" }); } catch (_) { body.scrollTop += delta; }
      }
      $("mr-up-top").onclick = () => scrollMobileRegie(-240);
      $("mr-down-top").onclick = () => scrollMobileRegie(240);
      $("mr-up-bot").onclick = () => scrollMobileRegie(-240);
      $("mr-down-bot").onclick = () => scrollMobileRegie(240);

      function sendTv(type, extra = {}) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type, ...extra }));
      }
      function pushMobilePbConfig(extra = {}) {
        sendTv("SET_PHOTOBOOTH_CONFIG", {
          store: mPbSelectedStore,
          opts: mPbOpts,
          stores: mPbStores,
          ...extra,
        });
      }
      function syncMobilePbControls() {
        const btn = $("mr-pb-toggle");
        if (btn) {
          btn.textContent = mPbOpts.enabled ? "👁️ Photobooth : Affiché" : "🙈 Photobooth : Masqué";
          btn.className = `w-full rounded-xl px-3 py-2.5 text-xs font-bold text-left transition ${
            mPbOpts.enabled ? "bg-emerald-600/80" : "bg-slate-700 text-white/80"
          }`;
        }
        const sel = $("mr-pb-store-select");
        if (sel) {
          sel.innerHTML = mPbStores.map(s => `<option value="${esc(s.name)}" ${s.name === mPbSelectedStore ? "selected" : ""}>${esc(s.name)}</option>`).join("");
        }
        if ($("mr-pb-speed-select")) $("mr-pb-speed-select").value = String(mPbOpts.speedSec);
        if ($("mr-pb-order-select")) $("mr-pb-order-select").value = mPbOpts.order;
        setText("mr-pb-status", `Magasin actif sur TV : ${mPbSelectedStore} · ${mPbOpts.order === "asc" ? "Chronologique" : "Récentes d'abord"}`);
      }
      function renderMobileStoresEditor() {
        const box = $("mr-pb-stores-editor");
        if (!box) return;
        box.innerHTML = mPbStores.map((s, idx) => `
          <div class="bg-white/5 rounded-lg p-2 flex flex-col gap-1">
            <div class="flex items-center gap-1">
              <input data-idx="${idx}" data-field="name" value="${esc(s.name)}" class="mr-pb-edit-input flex-1 rounded bg-slate-800 border border-white/10 px-2 py-1 text-xs font-bold text-white outline-none" />
              ${mPbStores.length > 1 ? `<button data-del="${idx}" title="Supprimer" class="mr-pb-del-btn text-xs px-1.5 py-1 rounded bg-rose-600/70">🗑️</button>` : ""}
            </div>
            <input data-idx="${idx}" data-field="url" value="${esc(s.url)}" class="mr-pb-edit-input w-full rounded bg-slate-800 border border-white/10 px-2 py-1 text-[11px] text-amber-200 outline-none" />
          </div>`).join("");
        box.querySelectorAll(".mr-pb-del-btn").forEach(btn => {
          btn.onclick = () => {
            const idx = Number(btn.dataset.del);
            mPbStores.splice(idx, 1);
            if (!mPbStores.some(x => x.name === mPbSelectedStore)) {
              mPbSelectedStore = mPbStores[0].name;
            }
            syncMobilePbControls();
            renderMobileStoresEditor();
            pushMobilePbConfig({ refresh: true });
          };
        });
      }
      syncMobilePbControls();

      function connectRegieWs() {
        ws = new WebSocket(`${WS_BASE}/ws/tv?room=${encodeURIComponent(roomCode)}`);
        ws.onopen = () => setText("mregie-conn", "🟢 Connecté");
        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          if (msg.type === "state") {
            state = msg;
            updateMobileRegie();
          }
        };
        ws.onclose = () => { setText("mregie-conn", "🔴 Reconnexion…"); setTimeout(connectRegieWs, 2000); };
      }
      connectRegieWs();

      $("mr-next").onclick = () => sendTv("NEXT");
      $("mr-speed").onclick = () => sendTv("TOGGLE_SPEED");
      $("mr-vote").onclick = () => sendTv("TOGGLE_VOTE");
      $("mr-mobile").onclick = () => { if (roomCode) window.open(`${window.location.origin}/?room=${encodeURIComponent(roomCode)}`, "_blank"); };
      $("mr-test-game").onclick = () => sendTv("START_TEST_GAME");
      $("mr-test-lobby").onclick = () => sendTv("TEST_GAME_LOBBY");
      $("mr-test-stop").onclick = () => sendTv("STOP_TEST_GAME");
      $("mr-btn-qr").onclick = async () => {
        const box = $("mr-qr-box");
        box.classList.toggle("hidden");
        if (!box.classList.contains("hidden")) {
          const qbox = $("mr-inline-qr");
          qbox.innerHTML = `<div class="text-xs text-slate-600 font-bold py-6 text-center">QR…</div>`;
          try {
            const res = await fetch("/api/auth/pair-create", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ room: roomCode, target: "regie" }),
            });
            const data = await res.json();
            if (res.ok && data.ok) {
              qbox.innerHTML = "";
              const authUrl = `${window.location.origin}/?tv_auth=${encodeURIComponent(data.pair_code)}&target=regie`;
              new QRCode(qbox, { text: authUrl, width: 256, height: 256, colorDark: "#1e1b4b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
            }
          } catch (_) {}
        }
      };
      $("mr-pb-refresh").onclick = () => {
        sendTv("REFRESH_PHOTOBOOTH");
        setText("mr-pb-status", `Actualisation demandée sur la TV (${mPbSelectedStore})…`);
      };
      $("mr-pb-toggle").onclick = () => {
        mPbOpts.enabled = !mPbOpts.enabled;
        syncMobilePbControls();
        pushMobilePbConfig();
      };
      $("mr-pb-store-select").onchange = (e) => {
        mPbSelectedStore = e.target.value;
        syncMobilePbControls();
        pushMobilePbConfig();
      };
      $("mr-pb-speed-select").onchange = (e) => {
        mPbOpts.speedSec = Number(e.target.value) || 4;
        syncMobilePbControls();
        pushMobilePbConfig();
      };
      $("mr-pb-order-select").onchange = (e) => {
        mPbOpts.order = e.target.value === "desc" ? "desc" : "asc";
        syncMobilePbControls();
        pushMobilePbConfig();
      };
      $("mr-pb-manage").onclick = () => {
        const panel = $("mr-pb-manage-panel");
        panel.classList.toggle("hidden");
        if (!panel.classList.contains("hidden")) renderMobileStoresEditor();
      };
      $("mr-pb-add-store").onclick = () => {
        const name = ($("mr-pb-new-name").value || "").trim();
        const url = ($("mr-pb-new-url").value || "").trim();
        if (!name || !url) return;
        mPbStores.push({ name, url });
        mPbSelectedStore = name;
        $("mr-pb-new-name").value = "";
        $("mr-pb-new-url").value = "";
        syncMobilePbControls();
        renderMobileStoresEditor();
        pushMobilePbConfig({ refresh: true });
      };
      $("mr-pb-save-stores").onclick = () => {
        document.querySelectorAll(".mr-pb-edit-input").forEach(inp => {
          const idx = Number(inp.dataset.idx);
          const field = inp.dataset.field;
          if (mPbStores[idx]) mPbStores[idx][field] = inp.value.trim();
        });
        mPbStores = mPbStores.filter(s => s.name && s.url);
        if (!mPbStores.length) mPbStores = DEFAULT_STORES.map(s => ({ ...s }));
        if (!mPbStores.some(s => s.name === mPbSelectedStore)) {
          mPbSelectedStore = mPbStores[0].name;
        }
        syncMobilePbControls();
        renderMobileStoresEditor();
        pushMobilePbConfig({ refresh: true });
      };
      $("mr-lock-btn").onclick = () => sendTv("TOGGLE_PAGE_LOCK");
      $("mr-pwd-toggle").onclick = () => {
        $("mr-pwd-panel").classList.toggle("hidden");
        setText("mr-pwd-fb", "");
      };
      $("mr-sheets-save").onclick = () => sendTv("SET_SHEETS_WEBHOOK", { webhook_url: ($("mr-webhook").value || "").trim() });
      $("mr-sheets-test").onclick = () => { setText("mr-sheets-status", "Test en cours…"); sendTv("TEST_SHEETS_PUSH"); };
      $("mr-pwd-save").onclick = async () => {
        setText("mr-pwd-fb", "");
        try {
          const res = await fetch("/api/auth/change-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: adminToken, target_user: $("mr-pwd-user").value, new_password: $("mr-pwd-val").value }),
          });
          const d = await res.json();
          if (!res.ok || !d.ok) { setText("mr-pwd-fb", `❌ ${d.detail || "Erreur"}`); return; }
          if (d.username === "AdminLGE" && d.token) adminToken = d.token;
          $("mr-pwd-val").value = "";
          setText("mr-pwd-fb", `✅ Mot de passe de ${d.username} mis à jour !`);
        } catch (e) { setText("mr-pwd-fb", `❌ ${e.message || "Erreur réseau"}`); }
      };

      function updateMobileRegie() {
        const s = state;
        if (!s) return;
        setText("mregie-phase", s.phase);
        setText("mregie-timer", fmt(s.timer));
        setText("mr-speed", `⚡ Vitesse : ${s.speed}x`);
        setText("mr-vote", `🗳️ Vote : ${s.voting_enabled ? "ON" : "OFF"}`);
        setText("mr-vote-hint", s.voting_enabled ? "🗳️ Vote joueurs actif" : "Sélection régie");

        if (s.pb_config) {
          const pbc = s.pb_config;
          const pbcKey = JSON.stringify({
            store: pbc.store,
            opts: pbc.opts,
            stores: pbc.stores,
          });
          if (pbcKey !== mPbConfigKey) {
            mPbConfigKey = pbcKey;
            if (Array.isArray(pbc.stores) && pbc.stores.length) {
              mPbStores = pbc.stores.map(x => ({ name: x.name, url: x.url }));
            }
            if (pbc.store && mPbStores.some(x => x.name === pbc.store)) {
              mPbSelectedStore = pbc.store;
            }
            if (pbc.opts && typeof pbc.opts === "object") {
              mPbOpts = {
                enabled: pbc.opts.enabled !== false,
                speedSec: Number(pbc.opts.speedSec) || 4,
                order: pbc.opts.order === "desc" ? "desc" : "asc",
              };
            }
            syncMobilePbControls();
            if (!$("mr-pb-manage-panel").classList.contains("hidden")) renderMobileStoresEditor();
          }
        }

        const mBotsCount = s.bots_count || 0;
        const mHasBots = mBotsCount > 0;
        setText("mr-bots-badge", mHasBots ? `${mBotsCount} bots actifs` : "Inactif");
        setText("mr-test-game", mHasBots ? "🔄 Relancer Partie test (8 bots)" : "🤖 Partie test (8 bots)");
        $("mr-test-lobby").classList.toggle("hidden", !mHasBots);
        $("mr-test-stop").classList.toggle("hidden", !mHasBots);

        const lockBtn = $("mr-lock-btn");
        const lockKey = String(!!s.page_lock_enabled);
        if (lockBtn.dataset.lockState !== lockKey) {
          lockBtn.dataset.lockState = lockKey;
          lockBtn.textContent = s.page_lock_enabled
            ? "🔒 Blocage page (LGE) : ACTIVÉ"
            : "🔓 Blocage page (LGE) : DÉSACTIVÉ";
          lockBtn.className = `w-full rounded-xl px-3 py-2.5 text-xs font-bold text-left ${
            s.page_lock_enabled ? "bg-emerald-600/80" : "bg-slate-700 text-white/80"
          }`;
        }

        const pushSt = s.last_push_status || {};
        setText("mr-sheets-status", !s.sheets_webhook_set
          ? "🟡 Webhook non configuré"
          : pushSt.ok === false
            ? `🔴 ${pushSt.message || "Erreur"}`
            : pushSt.ok === true
              ? `🟢 ${pushSt.message || "Synchro OK"}`
              : "🟢 Drive actif");

        const cats = s.categories || [];
        const cKey = cats.join("|");
        if (cKey !== catsBuiltKey) {
          catsBuiltKey = cKey;
          catsStateKey = "";
          const box = $("mr-cats");
          box.innerHTML = cats.map(cat => `
            <button data-cat="${esc(cat)}" class="mr-cat-btn rounded-xl px-3 py-2 text-xs font-bold bg-white/10 flex items-center justify-between text-left">
              <span>${catIcon(cat)} ${esc(cat)}</span>
              <span class="mr-cat-meta text-[11px]"></span>
            </button>`).join("");
          box.querySelectorAll(".mr-cat-btn").forEach(btn => {
            btn.onclick = () => sendTv("SELECT_CATEGORY", { category: btn.dataset.cat });
          });
        }

        const played = new Set(s.played_categories || []);
        const votes = s.votes || {};
        const csKey = `${s.category}|${s.voting_enabled}|${(s.played_categories || []).join(",")}|${cats.map(c => votes[c] || 0).join(",")}`;
        if (csKey !== catsStateKey) {
          catsStateKey = csKey;
          document.querySelectorAll(".mr-cat-btn").forEach(btn => {
            const cat = btn.dataset.cat;
            const active = cat === s.category;
            const locked = played.has(cat);
            btn.disabled = s.voting_enabled && locked;
            btn.className = `mr-cat-btn rounded-xl px-3 py-2 text-xs font-bold flex items-center justify-between text-left ${
              active ? "bg-amber-400 text-slate-900" : locked ? "bg-white/5 opacity-40" : "bg-white/10"
            }`;
            const meta = btn.querySelector(".mr-cat-meta");
            if (meta) meta.textContent = locked ? "🔒" : (s.voting_enabled ? `🗳️ ${votes[cat] || 0}` : "");
          });
        }

        const pKey = s.players.map(p => `${p.id}:${p.name}:${p.avatar}:${p.connected ? 1 : 0}:${p.missed_streak || 0}`).join("|");
        if (pKey !== playersKey) {
          playersKey = pKey;
          setText("mr-pcount", `(${s.players.length})`);
          const pbox = $("mr-players");
          pbox.innerHTML = s.players.length ? s.players.map(p => `
            <div class="bg-white/5 rounded-xl px-3 py-2 flex items-center gap-2 text-xs">
              <span class="w-2 h-2 rounded-full ${p.connected ? "bg-emerald-400" : "bg-rose-400"}"></span>
              <span class="text-base">${esc(p.avatar)}</span>
              <span class="flex-1 font-semibold truncate">${esc(p.name)}</span>
              ${p.missed_streak > 0 ? `<span class="text-[10px] bg-amber-500/20 text-amber-200 rounded px-1.5 py-0.5">⚠️ ${p.missed_streak}/5</span>` : ""}
              <button data-kick="${esc(p.id)}" class="mr-kick-btn bg-rose-600/80 text-white rounded-lg px-2 py-1 font-bold">✕</button>
            </div>`).join("") : `<div class="text-xs opacity-60">Aucun joueur en salle</div>`;
          pbox.querySelectorAll(".mr-kick-btn").forEach(btn => {
            btn.onclick = () => sendTv("KICK_PLAYER", { player_id: btn.dataset.kick });
          });
        }
      }
    }

    function renderPairLogin() {
      let needChange = false;
      app.innerHTML = `
        <div class="h-[100dvh] flex flex-col max-w-md mx-auto p-5 justify-center gap-4 pop">
          <div class="flex justify-center"><img src="${LOGO_URL}" alt="Laser Game Evolution" class="h-12 w-auto object-contain" /></div>
          <h1 class="text-2xl font-black text-center">${pairTarget === "regie" ? "⚙️ Accès Régie (AdminLGE)" : "🔓 Débloquer la TV"}</h1>
          <p class="text-xs opacity-80 text-center">
            ${pairRoom ? `Salle <b>${esc(pairRoom)}</b> · ` : ""}
            ${pairTarget === "regie" ? "Entrez le mot de passe AdminLGE sur votre cellulaire." : "Validez votre mot de passe LGE ou AdminLGE pour débloquer l'écran TV."}
          </p>
          <div class="flex flex-col gap-2.5">
            <input id="staff-user" value="${pairTarget === "regie" ? "AdminLGE" : "LGE"}" placeholder="Identifiant (LGE ou AdminLGE)" class="w-full rounded-xl bg-slate-800 border border-white/15 px-4 py-3 text-base font-bold text-white outline-none focus:ring-2 ring-amber-400" />
            <input id="staff-pass" type="password" placeholder="Mot de passe" autocomplete="current-password" class="w-full rounded-xl bg-slate-800 border border-white/15 px-4 py-3 text-base font-bold text-white outline-none focus:ring-2 ring-amber-400" />
          </div>
          <div id="staff-change-fields" class="hidden flex flex-col gap-2 bg-amber-400/10 border border-amber-300/40 rounded-2xl p-3">
            <div class="text-xs font-bold text-amber-200 text-center">🔑 Première connexion AdminLGE : nouveau mot de passe requis</div>
            <input id="staff-new-pass" type="password" placeholder="Nouveau mot de passe (min. 4 car.)" class="w-full rounded-xl bg-slate-800 border border-white/15 px-3.5 py-2.5 text-sm font-bold text-white outline-none" />
            <input id="staff-confirm-pass" type="password" placeholder="Confirmer le nouveau mot de passe" class="w-full rounded-xl bg-slate-800 border border-white/15 px-3.5 py-2.5 text-sm font-bold text-white outline-none" />
          </div>
          <button id="staff-submit" class="w-full rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black py-3.5 text-base shadow-xl active:scale-95 transition">
            ${pairTarget === "regie" ? "🔐 Connexion Régie Mobile" : "🔓 Valider & Débloquer la TV"}
          </button>
          <div id="staff-err" class="text-xs text-rose-300 text-center min-h-[1rem]"></div>
        </div>`;

      async function doPairSubmit() {
        setText("staff-err", "");
        const username = ($("staff-user").value || "").trim();
        const password = $("staff-pass").value || "";
        let new_password = "";
        if (needChange) {
          new_password = $("staff-new-pass").value || "";
          const conf = $("staff-confirm-pass").value || "";
          if (new_password !== conf) { setText("staff-err", "Les deux mots de passe ne correspondent pas."); return; }
          if (new_password.trim().length < 4) { setText("staff-err", "Minimum 4 caractères requis."); return; }
        }
        try {
          const res = await fetch("/api/auth/pair-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pair_code: TV_AUTH_PARAM, username, password, new_password }),
          });
          const d = await res.json();
          if (!res.ok || !d.ok) {
            setText("staff-err", d.detail || "Identifiant ou mot de passe incorrect.");
            return;
          }
          if (d.must_change_password) {
            needChange = true;
            $("staff-change-fields").classList.remove("hidden");
            setText("staff-submit", "💾 Enregistrer & Débloquer");
            setText("staff-err", "Mot de passe temporaire validé : définissez votre nouveau mot de passe.");
            $("staff-new-pass").focus();
            return;
          }
          if (d.approved) {
            if (d.role === "admin") renderMobileRegie(d.room || pairRoom, d.token);
            else renderLgeUnlocked(d.room || pairRoom);
          }
        } catch (e) {
          setText("staff-err", e.message || "Erreur réseau");
        }
      }

      $("staff-submit").onclick = doPairSubmit;
      $("staff-pass").onkeydown = (e) => { if (e.key === "Enter") doPairSubmit(); };
      $("staff-confirm-pass").onkeydown = (e) => { if (e.key === "Enter") doPairSubmit(); };
      setTimeout(() => $("staff-pass").focus(), 60);
    }

    (async function bootStaffAuth() {
      try {
        const res = await fetch(`/api/auth/pair-status?code=${encodeURIComponent(TV_AUTH_PARAM)}`);
        const d = await res.json();
        if (!res.ok || !d.ok || d.expired) {
          renderExpired();
          return;
        }
        pairTarget = d.target || pairTarget;
        pairRoom = d.room || "";
        renderPairLogin();
      } catch (_) {
        renderPairLogin();
      }
    })();
  }
</script>
</body>
</html>
