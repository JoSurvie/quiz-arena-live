<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1e1b4b" />
  <title>Laser Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    html, body { height: 100%; overflow-x: hidden; }
    body {
      background: radial-gradient(circle at 20% 10%, #4c1d95 0%, #1e1b4b 45%, #0f0a2e 100%);
      font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #big-qr img, #big-qr canvas, #mini-qr img, #mini-qr canvas,
    #lock-qr img, #lock-qr canvas, #admin-qr img, #admin-qr canvas,
    #regie-inline-qr img, #regie-inline-qr canvas { width: 100%; height: auto; display: block; }
    .pop { animation: pop .35s ease-out; }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .pulse-soft { animation: pulseSoft 2s ease-in-out infinite; }
    @keyframes pulseSoft { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    .answer-btn:active:not(:disabled) { transform: scale(.96); }
    @keyframes podiumRise {
      0% { transform: translateY(60px) scaleY(.15); opacity: 0; }
      70% { transform: translateY(-6px) scaleY(1.03); opacity: 1; }
      100% { transform: translateY(0) scaleY(1); opacity: 1; }
    }
    @keyframes avatarBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes shine {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .podium-step { transform-origin: bottom; animation: podiumRise .75s cubic-bezier(.22,1,.36,1) both; }
    .podium-1 { animation-delay: .42s; }
    .podium-2 { animation-delay: .24s; }
    .podium-3 { animation-delay: .08s; }
    .podium-avatar { display: inline-block; animation: avatarBounce 1.8s ease-in-out infinite; }
    .podium-shine {
      background-image: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
      background-size: 200% 100%;
      animation: shine 2.4s linear infinite;
    }
    @keyframes marqueeLeftToRight {
      0% { transform: translate3d(-50%, 0, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    .pb-marquee-track {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: max-content;
      will-change: transform;
      backface-visibility: hidden;
      animation: marqueeLeftToRight var(--pb-duration, 90s) linear infinite;
    }
    .pb-marquee-track img {
      backface-visibility: hidden;
    }
    #timer, #pb-section, #player-list {
      contain: layout paint;
    }
    @keyframes flamePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(251, 146, 60, .65)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 18px rgba(250, 204, 21, .95)); }
    }
    @keyframes iceShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px) rotate(-1.5deg); }
      40% { transform: translateX(5px) rotate(1.5deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    @keyframes speedFlash {
      0% { transform: translateX(-24px) skewX(-8deg); opacity: 0; }
      60% { transform: translateX(4px) skewX(-2deg); opacity: 1; }
      100% { transform: translateX(0) skewX(0); opacity: 1; }
    }
    @keyframes eventSlideIn {
      0% { transform: translateY(-14px) scale(.92); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .anim-flame { animation: flamePulse 1.3s ease-in-out infinite; }
    .anim-ice { animation: iceShake .65s ease-in-out 2; }
    .anim-speed { animation: speedFlash .55s cubic-bezier(.22,1,.36,1) both; }
    .anim-event { animation: eventSlideIn .45s cubic-bezier(.22,1,.36,1) both; }
    @keyframes ctaBreathe {
      0%, 100% { transform: scale(1); text-shadow: 0 0 10px rgba(252, 211, 77, .35); }
      50% { transform: scale(1.06); text-shadow: 0 0 24px rgba(252, 211, 77, .85); }
    }
    .cta-breathe {
      display: inline-block;
      will-change: transform;
      animation: ctaBreathe 2.6s ease-in-out infinite;
    }
  </style>
</head>
<body class="text-white antialiased">
  <div id="app" class="h-full"></div>

<script>
  "use strict";

  const SHAPES = ["▲", "◆", "●", "■"];
  const LOGO_URL = "https://lasergame-evolution.ca/wp-content/uploads/2025/01/CANADA-vector-logo-color-bl-black-copie-01.png";
  const DEFAULT_STORES = [
    { name: "Sainte-Foy", url: "https://www.simplebooth.com/gallery/3DTLTk68fwVM-lge-fev-2026" },
    { name: "Vanier", url: "https://www.simplebooth.com/gallery/8KonRrq3avT5-lge-fev-26" },
    { name: "Brossard", url: "https://www.simplebooth.com/gallery/urjGcth7fSdh-lge-2026" },
    { name: "Marché Central", url: "https://www.simplebooth.com/gallery/3vaHgUNcJUos-lge-fev-2026" },
    { name: "Lévis", url: "https://www.simplebooth.com/gallery/ahebLG4GWjZF-lge-fev-2026" },
    { name: "Sherbrooke", url: "https://www.simplebooth.com/gallery/XCaTpPmn6r3h-lge-fev-2026" },
    { name: "Ste-Catherine", url: "https://www.simplebooth.com/gallery/ALkJDisegsdU-lge-fev-2026" }
  ];
  function setCookie(name, value, days = 365) {
    document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; path=/; max-age=${days * 86400}; SameSite=Lax`;
  }
  function getCookie(name) {
    const prefix = encodeURIComponent(name) + "=";
    for (const part of document.cookie.split("; ")) {
      if (part.startsWith(prefix)) return decodeURIComponent(part.slice(prefix.length));
    }
    return null;
  }
  const COLORS = ["bg-rose-500", "bg-sky-500", "bg-amber-400", "bg-emerald-500"];
  const AVATARS = ["😎", "🦊", "🐼", "🐸", "🦁", "🐙", "🦄", "🐯", "🐵", "🐧", "🤖", "👽", "🐲", "🍕", "🚀", "⚡"];
  const CAT_ICONS = {
    "Histoire & Géographie": "🌍",
    "Sciences & Nature": "🔬",
    "Cinéma & Pop Culture": "🎬",
    "Arts, Musique & Littérature": "🎨",
    "Sport & Gastronomie": "🏅",
    "Mix Aléatoire": "🎲"
  };
  function catIcon(c) { return CAT_ICONS[c] || "🎯"; }
  const app = document.getElementById("app");
  const params = new URLSearchParams(window.location.search);
  const ROOM_PARAM = (params.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5);
  const TV_AUTH_PARAM = (params.get("tv_auth") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const WS_BASE = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmt(sec) {
    sec = Math.max(0, sec | 0);
    const m = Math.floor(sec / 60), s = sec % 60;
    return m > 0 ? `${m}:${String(s).padStart(2, "0")}` : String(s);
  }
  function $(id) { return document.getElementById(id); }
  function setText(id, v) {
    const el = $(id);
    if (!el) return;
    const next = String(v ?? "");
    if (el.textContent !== next) el.textContent = next;
  }

  if (TV_AUTH_PARAM) initStaffAuth(); else if (params.has("room")) initPlayer(); else initTV();

  /* ======================================================================
   *  MODE TV
   * ==================================================================== */
  function initTV() {
    let ws = null;
    let state = null;
    let roomCode = localStorage.getItem("qal_tv_room") || "";
    let lastKey = "";
    let miniQrFor = "";
    let confettiTimer = null;
    let wakeLock = null;
    let userToken = localStorage.getItem("qal_user_token") || "";
    let adminToken = localStorage.getItem("qal_admin_token") || "";
    let pageLockEnabled = true;
    let pageUnlocked = false;
    let adminAuthed = false;
    let pendingChangeToken = "";
    let pendingChangeSource = "regie";
    let tvStarted = false;
    let pbIntervalStarted = false;

    // --- Photobooth (cookies locaux par magasin) ---------------------------
    let pbStores = (() => {
      try {
        const raw = getCookie("lge_pb_stores");
        const parsed = raw ? JSON.parse(raw) : null;
        if (Array.isArray(parsed) && parsed.length) return parsed;
      } catch (_) {}
      return DEFAULT_STORES.map(s => ({ ...s }));
    })();
    let pbOpts = (() => {
      try {
        const raw = getCookie("lge_pb_opts");
        const parsed = raw ? JSON.parse(raw) : null;
        if (parsed && typeof parsed === "object") {
          return {
            enabled: parsed.enabled !== false,
            speedSec: Number(parsed.speedSec) || 4,
            order: parsed.order === "desc" ? "desc" : "asc"
          };
        }
      } catch (_) {}
      return { enabled: true, speedSec: 4, order: "asc" };
    })();
    let pbSelectedStore = getCookie("lge_pb_store") || pbStores[0].name;
    if (!pbStores.some(s => s.name === pbSelectedStore)) pbSelectedStore = pbStores[0].name;
    setCookie("lge_pb_store", pbSelectedStore);

    let pbPhotos = [];
    let pbStatusText = "Chargement…";
    let pbTrackKey = "";
    let regieCatsKey = "";
    let lastPlayersKey = "__INIT__";
    let lastCatsStateKey = "";
    let lastDiffKey = "";
    let lastRegieOpen = false;
    let preloadToken = 0;
    let lastPbConfigKey = "";
    let lastPbRefreshSeq = 0;

    function pushPhotoboothConfig(extra = {}) {
      send("SET_PHOTOBOOTH_CONFIG", {
        store: pbSelectedStore,
        opts: pbOpts,
        stores: pbStores,
        ...extra,
      });
    }

    function currentStore() {
      return pbStores.find(s => s.name === pbSelectedStore) || pbStores[0];
    }
    function saveStoresCookie() {
      setCookie("lge_pb_stores", JSON.stringify(pbStores));
    }
    function saveOptsCookie() {
      setCookie("lge_pb_opts", JSON.stringify(pbOpts));
    }
    function preloadPhotos(list) {
      const token = ++preloadToken;
      let idx = 0;
      function next() {
        if (token !== preloadToken || idx >= list.length) return;
        const p = list[idx++];
        const img = new Image();
        img.decoding = "async";
        img.onload = img.onerror = next;
        img.src = p.thumb || p.url;
      }
      next();
    }
    async function loadPhotobooth(force = false) {
      if (!force && !pbOpts.enabled) return;
      const store = currentStore();
      if (!store || !store.url) {
        pbPhotos = [];
        pbStatusText = "Aucun lien Simple Booth configuré";
        renderPhotoboothStrip(true);
        return;
      }
      pbStatusText = "Actualisation…";
      setText("pb-regie-status", `${store.name} : actualisation…`);
      try {
        const res = await fetch(`/api/photobooth?url=${encodeURIComponent(store.url)}&limit=18&order=${encodeURIComponent(pbOpts.order)}&force=${force ? 1 : 0}`);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.detail || "Erreur chargement galerie");
        pbPhotos = Array.isArray(data.photos) ? data.photos : [];
        pbStatusText = pbPhotos.length ? `${pbPhotos.length} photo(s) · ${pbOpts.order === "asc" ? "Chronologique" : "Récentes d'abord"}` : "Aucune photo disponible";
        setText("pb-regie-status", `${store.name} : ${pbPhotos.length} photo(s)`);
        if (pbOpts.enabled) preloadPhotos(pbPhotos);
      } catch (e) {
        pbStatusText = "Impossible de charger le photobooth";
        setText("pb-regie-status", `Erreur : ${e.message || e}`);
      }
      renderPhotoboothStrip(false);
    }

    const joinUrl = () => `${window.location.origin}/?room=${roomCode}`;

    // --- Anti-veille -------------------------------------------------------
    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; updateWakeBadge(); });
        }
      } catch (e) { console.warn("WakeLock indisponible :", e); }
      updateWakeBadge();
    }
    function updateWakeBadge() {
      const el = $("wake");
      if (el) el.textContent = wakeLock ? "🔆 Écran maintenu allumé" : "💤 Cliquez pour empêcher la veille";
    }
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") requestWakeLock(); });
    document.addEventListener("click", () => requestWakeLock());

    // --- Structure ---------------------------------------------------------
    app.innerHTML = `
      <div class="h-full flex flex-col overflow-hidden">
        <header class="flex flex-wrap items-center justify-between gap-2 px-4 sm:px-6 py-1.5 sm:py-2.5 pr-14 sm:pr-20 shrink-0">
          <div class="flex flex-wrap items-center gap-2 sm:gap-3">
            <img src="${LOGO_URL}" alt="Laser Game Evolution" class="h-7 sm:h-10 w-auto object-contain" />
            <div class="text-lg sm:text-2xl xl:text-3xl font-black tracking-tight">Laser <span class="text-amber-300">Quiz</span></div>
            <span id="live" class="text-[10px] sm:text-xs font-bold bg-rose-600 px-2 py-0.5 rounded-full">● LIVE</span>
            <span id="speed-badge" class="hidden text-[10px] sm:text-xs font-bold bg-amber-400 text-slate-900 px-2 py-0.5 rounded-full">⚡ 5x</span>
            <span id="vote-badge" class="text-[10px] sm:text-xs font-bold bg-indigo-500 text-white px-2.5 py-0.5 rounded-full">🗳️ Vote actif</span>
            <span id="diff-badge" class="text-[10px] sm:text-xs font-bold bg-white/15 px-2.5 py-0.5 rounded-full"></span>
          </div>
          <div id="mini-qr-wrap" class="hidden items-center gap-2.5 sm:gap-3 bg-white/10 rounded-2xl p-1 sm:p-1.5 pr-3.5 sm:pr-5">
            <div class="bg-white p-1 rounded-xl w-11 sm:w-14 lg:w-16 shrink-0"><div id="mini-qr"></div></div>
            <div class="cta-breathe whitespace-nowrap text-xs sm:text-sm lg:text-base font-black text-amber-300 leading-none">Rejoins la partie !</div>
          </div>
        </header>
        <main id="tv-main" class="flex-1 min-h-0 overflow-hidden"></main>
      </div>

      <button id="gear" title="Régie" class="fixed top-3 right-4 text-2xl opacity-30 hover:opacity-100 transition z-50">⚙️</button>
      <div id="regie" class="hidden fixed top-14 right-4 z-50 bg-slate-900/95 border border-white/15 rounded-2xl shadow-2xl flex flex-col w-[min(24rem,calc(100vw-2rem))] max-h-[85dvh] overflow-hidden">
        <div class="shrink-0 flex items-center justify-between px-4 py-3 border-b border-white/10">
          <div class="text-xs uppercase tracking-wider opacity-60 font-bold">Régie</div>
          <div class="flex items-center gap-1.5">
            <button id="regie-up-top" title="Monter" class="bg-white/10 hover:bg-white/20 active:scale-95 rounded-lg px-2 py-1 text-xs font-bold">⬆️</button>
            <button id="regie-down-top" title="Descendre" class="bg-white/10 hover:bg-white/20 active:scale-95 rounded-lg px-2 py-1 text-xs font-bold">⬇️</button>
            <button id="regie-close" class="text-sm opacity-60 hover:opacity-100 px-1.5 py-0.5">✕</button>
          </div>
        </div>
        <div id="regie-body" class="flex-1 min-h-0 overflow-y-auto p-4 flex flex-col gap-3">
          <div class="grid grid-cols-2 gap-2">
            <button id="btn-next" class="bg-indigo-600 hover:bg-indigo-500 rounded-xl px-3 py-2 text-sm font-bold text-left">⏭️ Étape suivante</button>
            <button id="btn-speed" class="bg-amber-500 hover:bg-amber-400 text-slate-900 rounded-xl px-3 py-2 text-sm font-bold text-left">⚡ Vitesse : 1x</button>
            <button id="btn-vote" class="bg-violet-600 hover:bg-violet-500 rounded-xl px-3 py-2 text-sm font-bold text-left">🗳️ Vote : ON</button>
            <button id="btn-mobile" class="bg-emerald-600 hover:bg-emerald-500 rounded-xl px-3 py-2 text-sm font-bold text-left">📱 Vue Mobile</button>
          </div>
          <div class="bg-amber-500/10 border border-amber-400/30 rounded-xl p-2.5 flex flex-col gap-2">
            <div class="flex items-center justify-between">
              <span class="text-xs uppercase tracking-wider font-extrabold text-amber-300">🤖 Mode Partie Test</span>
              <span id="regie-bots-badge" class="text-[11px] font-bold text-amber-200"></span>
            </div>
            <div class="grid grid-cols-2 gap-1.5">
              <button id="btn-test-game" class="col-span-2 bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-300 hover:to-orange-300 text-slate-950 rounded-xl px-3 py-2 text-xs font-black text-center shadow transition active:scale-95">
                🤖 Partie test (8 bots)
              </button>
              <button id="btn-test-lobby" class="hidden bg-indigo-600/80 hover:bg-indigo-600 rounded-xl px-2.5 py-1.5 text-xs font-bold text-center transition active:scale-95">
                🏠 Lobby (8 bots)
              </button>
              <button id="btn-test-stop" class="hidden bg-rose-600/80 hover:bg-rose-600 rounded-xl px-2.5 py-1.5 text-xs font-bold text-center transition active:scale-95">
                🧹 Retirer les bots
              </button>
            </div>
          </div>
          <button id="btn-mobile-regie-qr" class="w-full bg-indigo-600/80 hover:bg-indigo-600 rounded-xl px-3 py-2 text-xs font-bold text-left">📱 Ouvrir la Régie sur mon cellulaire (QR)</button>
          <div id="regie-mobile-qr-box" class="hidden bg-slate-950/80 border border-white/15 rounded-xl p-3 flex flex-col items-center gap-2 text-center">
            <div class="bg-white p-2 rounded-xl w-36 h-36 mx-auto flex items-center justify-center"><div id="regie-inline-qr" class="w-full"></div></div>
            <div id="regie-inline-qr-status" class="text-[11px] opacity-80">Scannez et entrez le mot de passe AdminLGE sur votre cellulaire</div>
          </div>
          <div class="border-t border-white/10 pt-3">
            <div class="flex items-center justify-between text-xs uppercase tracking-wider opacity-75 mb-2">
              <span>Catégorie du quiz (15 questions)</span>
              <span id="regie-vote-hint" class="text-indigo-300 font-bold"></span>
            </div>
            <div id="regie-cats" class="flex flex-col gap-1.5"></div>
          </div>
          <div class="border-t border-white/10 pt-3 flex flex-col gap-2">
            <div class="flex items-center justify-between">
              <span class="text-xs uppercase tracking-wider opacity-75 font-bold">📸 Photobooth (Cookie local)</span>
              <button id="pb-refresh" title="Rafraîchir les photos" class="text-xs bg-white/10 hover:bg-white/20 rounded-lg px-2 py-1">🔄 Actualiser</button>
            </div>
            <button id="btn-pb-toggle" class="w-full rounded-xl px-3 py-2 text-xs font-bold text-left transition bg-emerald-600/80 hover:bg-emerald-600">👁️ Photobooth : Affiché</button>
            <select id="pb-store-select" class="w-full rounded-xl bg-slate-800 border border-white/15 px-3 py-2 text-sm font-bold text-white outline-none"></select>
            <div class="grid grid-cols-2 gap-2">
              <select id="pb-speed-select" class="rounded-xl bg-slate-800 border border-white/15 px-2.5 py-1.5 text-xs font-semibold text-white outline-none">
                <option value="2">Vitesse : Rapide (2s/photo)</option>
                <option value="4">Vitesse : Normale (4s/photo)</option>
                <option value="6">Vitesse : Douce (6s/photo)</option>
                <option value="10">Vitesse : Lente (10s/photo)</option>
              </select>
              <select id="pb-order-select" class="rounded-xl bg-slate-800 border border-white/15 px-2.5 py-1.5 text-xs font-semibold text-white outline-none">
                <option value="asc">Ordre : Chronologique</option>
                <option value="desc">Ordre : Récentes d'abord</option>
              </select>
            </div>
            <div id="pb-regie-status" class="text-[11px] opacity-70"></div>
            <button id="btn-pb-manage" class="text-xs bg-white/10 hover:bg-white/20 rounded-xl px-3 py-2 font-bold text-left">🔗 Gérer les 7 magasins / Ajouter un lieu</button>
            <div id="pb-manage-panel" class="hidden bg-slate-950/70 border border-white/10 rounded-xl p-2.5 flex flex-col gap-2">
              <div id="pb-stores-editor" class="flex flex-col gap-2"></div>
              <div class="border-t border-white/10 pt-2 flex flex-col gap-1.5">
                <div class="text-[11px] uppercase opacity-70 font-bold">Ajouter un magasin</div>
                <input id="pb-new-name" placeholder="Nom du magasin" class="w-full rounded-lg bg-slate-800 border border-white/15 px-2.5 py-1.5 text-xs text-white outline-none" />
                <input id="pb-new-url" placeholder="https://www.simplebooth.com/gallery/..." class="w-full rounded-lg bg-slate-800 border border-white/15 px-2.5 py-1.5 text-xs text-white outline-none" />
                <div class="flex gap-2">
                  <button id="pb-add-store" class="flex-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg py-1.5 text-xs font-bold">➕ Ajouter</button>
                  <button id="pb-save-stores" class="flex-1 bg-emerald-600 hover:bg-emerald-500 rounded-lg py-1.5 text-xs font-bold">💾 Enregistrer</button>
                </div>
              </div>
            </div>
          </div>
          <div class="border-t border-white/10 pt-3 flex flex-col gap-2">
            <div class="flex items-center justify-between">
              <span class="text-xs uppercase tracking-wider opacity-75 font-bold">📊 Stats Google Drive</span>
              <div class="flex items-center gap-1.5">

    function scrollRegie(delta) {

      if (typeof body.scrollBy === "function") {

          return;

      }
      body.scrollTop += delta;
    }

      const tag = ((document.activeElement && document.activeElement.tagName) || "").toUpperCase();
      if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
      if (e.key === "ArrowDown" || e.key === "PageDown") {
        e.preventDefault();
        scrollRegie(e.key === "PageDown" ? 360 : 180);
      } else if (e.key === "ArrowUp" || e.key === "PageUp") {
        e.preventDefault();
        scrollRegie(e.key === "PageUp" ? -360 : -180);

    function renderPhotoboothStrip(forceRebuild) {
      const strip = $("pb-strip");
      if (!strip) return;
      if (!pbOpts.enabled) {
        pbTrackKey = "";
        if (strip.innerHTML) strip.innerHTML = "";
        return;
      }
      const store = currentStore();
      if (!pbPhotos.length) {
        pbTrackKey = "";
        strip.innerHTML = `<div class="w-full text-center text-sm opacity-60">${esc(pbStatusText)}</div>`;
        return;
      }
      const key = `${store ? store.name : ""}|${pbOpts.speedSec}|${pbOpts.order}|${pbPhotos.map(p => p.code).join(",")}`;
      if (!forceRebuild && key === pbTrackKey && $("pb-track")) return;
      pbTrackKey = key;
      const block = [];
      const minItems = Math.min(18, Math.max(pbPhotos.length, 6));
      while (block.length < minItems) block.push(...pbPhotos);
      const loopItems = [...block, ...block];
      const duration = Math.max(18, block.length * pbOpts.speedSec);
      strip.innerHTML = `
        <div id="pb-track" class="pb-marquee-track h-full py-2 px-4" style="--pb-duration: ${duration}s">
          ${loopItems.map(p => `
            <div class="shrink-0 h-full rounded-2xl overflow-hidden bg-slate-900 border border-white/15 shadow-xl">
              <img src="${esc(p.thumb || p.url)}" alt="Photobooth" decoding="async"
                   onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${esc(p.url)}';}"
                   class="h-full w-auto object-contain" />
            </div>`).join("")}
        </div>`;
    }

    function connect() {
      const qs = roomCode ? `?room=${encodeURIComponent(roomCode)}` : "";
      ws = new WebSocket(`${WS_BASE}/ws/tv${qs}`);
      ws.onopen = () => {
        setText("conn", "🟢 Connecté");
        pushPhotoboothConfig({ init_only: true });
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "room") {
          if (msg.room !== roomCode) { lastKey = ""; miniQrFor = ""; }
          roomCode = msg.room;
          localStorage.setItem("qal_tv_room", roomCode);
        } else if (msg.type === "state") {
          state = msg;
          render();
        }
      };
      ws.onclose = () => { setText("conn", "🔴 Reconnexion…"); setTimeout(connect, 2000); };
    }
    function send(type, extra = {}) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type, ...extra })); }

    const pairTimers = {};

    function stopPairingQR(containerId) {
      if (pairTimers[containerId]) {
        clearInterval(pairTimers[containerId]);
        delete pairTimers[containerId];
      }
    }

    function stopAllPairingQR() {
      for (const k of Object.keys(pairTimers)) stopPairingQR(k);
    }

    function isPairingVisible(containerId) {
      if (containerId === "lock-qr") {
        const ov = $("page-lock-overlay");
        return !!(ov && !ov.classList.contains("hidden"));
      }
      if (containerId === "admin-qr") {
        const mod = $("admin-modal"), box = $("admin-login-box");
        return !!(mod && !mod.classList.contains("hidden") && box && !box.classList.contains("hidden"));
      }
      if (containerId === "regie-inline-qr") {
        const reg = $("regie"), box = $("regie-mobile-qr-box");
        return !!(reg && !reg.classList.contains("hidden") && box && !box.classList.contains("hidden"));
      }
      return false;
    }

    async function startPairingQR(target, containerId) {
      stopPairingQR(containerId);
      const box = $(containerId);
      if (!box) return;
      box.innerHTML = `<div class="text-xs text-slate-600 font-bold py-6 text-center">QR…</div>`;
      try {
        const res = await fetch("/api/auth/pair-create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ room: roomCode, target }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          box.innerHTML = `<div class="text-xs text-rose-600 font-bold p-2 text-center">Erreur QR</div>`;
          return;
        }
        if (data.room && data.room !== roomCode) {
          roomCode = data.room;
          localStorage.setItem("qal_tv_room", roomCode);
        }
        box.innerHTML = "";
        const authUrl = `${window.location.origin}/?tv_auth=${encodeURIComponent(data.pair_code)}&target=${encodeURIComponent(target)}`;
        new QRCode(box, {
          text: authUrl,
          width: 256,
          height: 256,
          colorDark: "#1e1b4b",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M,
        });

        pairTimers[containerId] = setInterval(async () => {
          if (!isPairingVisible(containerId)) {
            stopPairingQR(containerId);
            return;
          }
          try {
            const stRes = await fetch(`/api/auth/pair-status?code=${encodeURIComponent(data.pair_code)}&consume=1`);
            const st = await stRes.json();
            if (!st.ok && st.expired) {
              if (isPairingVisible(containerId)) startPairingQR(target, containerId);
              else stopPairingQR(containerId);
              return;
            }
            if (st.approved && st.token) {
              stopPairingQR(containerId);
              userToken = st.token;
              localStorage.setItem("qal_user_token", userToken);
              pageUnlocked = true;
              if (st.role === "admin") {
                adminToken = st.token;
                localStorage.setItem("qal_admin_token", adminToken);
                adminAuthed = true;
              }
              if (containerId === "regie-inline-qr") {
                setText("regie-inline-qr-status", `✅ Régie mobile connectée (${st.username})`);
              }
              if (target === "regie" && $("admin-modal") && !$("admin-modal").classList.contains("hidden")) {
                $("admin-modal").classList.add("hidden");
                $("regie").classList.remove("hidden");
              }
              syncLockOverlay();
            }
          } catch (_) {}
        }, 1500);
      } catch (_) {
        box.innerHTML = `<div class="text-xs text-rose-600 font-bold p-2 text-center">Hors ligne</div>`;
      }
    }

    function startTVSession() {
      if (tvStarted) return;
      tvStarted = true;
      loadPhotobooth(false);
      if (!pbIntervalStarted) {
        pbIntervalStarted = true;
        setInterval(() => loadPhotobooth(false), 180000);
      }
      connect();
    }

    function syncLockOverlay() {
      const overlay = $("page-lock-overlay");
      if (!pageLockEnabled || pageUnlocked) {
        if (overlay) overlay.classList.add("hidden");
        stopPairingQR("lock-qr");
        startTVSession();
      } else {
        if (overlay) overlay.classList.remove("hidden");
        if (!pairTimers["lock-qr"]) startPairingQR("page", "lock-qr");
      }
    }

    function openFirstLoginChangeModal(changeToken, source) {
      stopPairingQR("admin-qr");
      pendingChangeToken = changeToken;
      pendingChangeSource = source;
      $("admin-new-pass").value = "";
      $("admin-confirm-pass").value = "";
      setText("admin-change-err", "");
      $("admin-login-box").classList.add("hidden");
      $("admin-change-box").classList.remove("hidden");
      $("admin-modal").classList.remove("hidden");
      setTimeout(() => $("admin-new-pass").focus(), 50);
    }

    async function submitPageUnlock() {
      const username = ($("lock-user").value || "").trim();
      const password = $("lock-pass").value || "";
      setText("lock-err", "");
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, target: "page" }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          setText("lock-err", data.detail || "Identifiant ou mot de passe incorrect.");
          return;
        }
        if (data.must_change_password) {
          openFirstLoginChangeModal(data.change_token, "page");
          return;
        }
        userToken = data.token || "";
        localStorage.setItem("qal_user_token", userToken);
        if (data.role === "admin") {
          adminToken = data.token || "";
          localStorage.setItem("qal_admin_token", adminToken);
          adminAuthed = true;
        }
        pageUnlocked = true;
        $("lock-pass").value = "";
        syncLockOverlay();
      } catch (e) {
        setText("lock-err", e.message || "Erreur réseau");
      }
    }

    async function submitAdminLogin() {
      const username = ($("admin-user").value || "").trim();
      const password = $("admin-pass").value || "";
      setText("admin-login-err", "");
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, target: "regie" }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          setText("admin-login-err", data.detail || "Identifiant ou mot de passe incorrect.");
          return;
        }
        if (data.must_change_password) {
          openFirstLoginChangeModal(data.change_token, "regie");
          return;
        }
        adminToken = data.token || "";
        userToken = adminToken;
        localStorage.setItem("qal_admin_token", adminToken);
        localStorage.setItem("qal_user_token", userToken);
        adminAuthed = true;
        pageUnlocked = true;
        stopPairingQR("admin-qr");
        $("admin-pass").value = "";
        $("admin-modal").classList.add("hidden");
        syncLockOverlay();
        $("regie").classList.remove("hidden");
      } catch (e) {
        setText("admin-login-err", e.message || "Erreur réseau");
      }
    }

    async function submitAdminFirstChange() {
      const new_password = $("admin-new-pass").value || "";
      const confirm = $("admin-confirm-pass").value || "";
      setText("admin-change-err", "");
      if (new_password !== confirm) {
        setText("admin-change-err", "Les deux mots de passe ne correspondent pas.");
        return;
      }
      if (new_password.trim().length < 4) {
        setText("admin-change-err", "Minimum 4 caractères requis.");
        return;
      }
      try {
        const res = await fetch("/api/auth/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: pendingChangeToken, new_password }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          setText("admin-change-err", data.detail || "Erreur lors du changement.");
          return;
        }
        pendingChangeToken = "";
        adminToken = data.token || "";
        userToken = adminToken;
        localStorage.setItem("qal_admin_token", adminToken);
        localStorage.setItem("qal_user_token", userToken);
        adminAuthed = true;
        pageUnlocked = true;
        $("admin-modal").classList.add("hidden");
        syncLockOverlay();
        if (pendingChangeSource === "regie") {
          $("regie").classList.remove("hidden");
        }
      } catch (e) {
        setText("admin-change-err", e.message || "Erreur réseau");
      }
    }

    $("lock-submit").onclick = submitPageUnlock;
    $("lock-pass").onkeydown = (e) => { if (e.key === "Enter") submitPageUnlock(); };
    $("admin-login-btn").onclick = submitAdminLogin;
    $("admin-pass").onkeydown = (e) => { if (e.key === "Enter") submitAdminLogin(); };
    $("admin-change-btn").onclick = submitAdminFirstChange;
    $("admin-confirm-pass").onkeydown = (e) => { if (e.key === "Enter") submitAdminFirstChange(); };

    async function checkInitialAuth() {
      try {
        const qs = `user_token=${encodeURIComponent(userToken)}&admin_token=${encodeURIComponent(adminToken)}`;
        const res = await fetch(`/api/auth/status?${qs}`);
        const data = await res.json();
        if (res.ok && data.ok) {
          pageLockEnabled = !!data.page_lock_enabled;
          pageUnlocked = !!data.user_unlocked;
          adminAuthed = !!data.admin_authenticated;
          updatePageLockBtn();
        }
      } catch (_) {}
      syncLockOverlay();
    }
    checkInitialAuth();

    function eventCardClass(kind) {
      if (kind === "STREAK_15") return "bg-gradient-to-r from-amber-300 via-yellow-200 to-orange-400 text-slate-950 border-2 border-white anim-flame";
      if (kind === "STREAK_10") return "bg-gradient-to-r from-fuchsia-600 to-amber-500 text-white border border-amber-200/50 anim-flame";
      if (kind === "STREAK_5") return "bg-gradient-to-r from-orange-500 to-rose-500 text-white border border-amber-200/40 anim-flame";
      if (kind === "WRONG_5") return "bg-gradient-to-r from-sky-700 to-cyan-500 text-white border border-cyan-200/40 anim-ice";
      if (kind === "FASTEST_RECORD") return "bg-gradient-to-r from-indigo-600 to-cyan-500 text-white border border-cyan-200/50 anim-speed";
      if (kind === "LONE_WOLF") return "bg-gradient-to-r from-purple-700 to-rose-600 text-white border border-rose-200/40 anim-event";
      return "bg-gradient-to-r from-emerald-600 to-teal-500 text-white border border-white/25 anim-event";
    }

    function render() {
      const key = `${state.room}|${state.phase}|${state.q_index}`;
      if (key !== lastKey) {
        lastKey = key;
        buildView();
        const evs = state.round_events || [];
        const hasBigEvent = state.phase === "REVEAL" && evs.some(e => ["STREAK_5", "STREAK_10", "STREAK_15", "FASTEST_RECORD", "LONE_WOLF"].includes(e.kind));
        if (state.phase === "PODIUM") fireConfetti(6000);
        else if (state.phase === "INTER_PODIUM") fireConfetti(2200);
        else if (hasBigEvent) fireConfetti(1600);
        else stopConfetti();
      }
      updateDynamic();
    }

            <div class="flex-1 min-h-0 grid lg:grid-cols-3 gap-3 sm:gap-5 items-stretch overflow-hidden">

                ${b.length ? podiumHtml(b, ["h-[22vh]", "h-[16vh]", "h-[11vh]"]) : `<div class="text-xl sm:text-2xl opacity-60 my-auto">En attente des joueurs…</div>`}

                    ${streakRec ? `<div class="bg-orange-900/50 border border-amber-300/40 rounded-full px-3 py-1 text-xs sm:text-sm font-bold">🔥 Meilleure série : ${esc(streakRec.avatar)} ${esc(streakRec.name)} (${streakRec.streak} d'affilée)</div>` : ""}
                  </div>` : ""}
              </div>
              <div class="bg-white/10 rounded-2xl sm:rounded-3xl p-3 sm:p-4 h-full min-h-0 overflow-y-auto">
                <h3 class="text-base sm:text-xl font-bold mb-2">📊 Classement actuel</h3>
                ${b.length ? b.slice(0, 10).map((p, i) => `
                  <div class="flex items-center gap-2 py-1 border-b border-white/10 pop">
                    <span class="w-6 text-base sm:text-lg font-black text-amber-300">${i + 1}</span>
                    <span class="text-xl sm:text-2xl">${esc(p.avatar)}</span>
                    <span class="flex-1 text-sm sm:text-base font-semibold truncate">${esc(p.name)}</span>
                    <span class="text-sm sm:text-base font-bold w-16 sm:w-20 text-right">${p.score} pts</span>
                  </div>`).join("") : `<div class="opacity-60">Aucun joueur</div>`}
              </div>
            </div>
          </div>`;
      } else if (s.phase === "PODIUM") {
        const b = s.leaderboard;
        const fastRec = s.fastest_record;
        const streakRec = s.best_streak_record;
        main.innerHTML = `

            <div class="shrink-0 text-center">
              <div class="inline-block bg-white/15 rounded-full px-3 py-0.5 text-xs sm:text-sm font-bold mb-0.5">${catIcon(s.category)} ${esc(s.category)}</div>
              <h1 class="text-[clamp(1.5rem,4.5vh,3rem)] font-black leading-tight">🏆 Podium Final</h1>
              <div class="opacity-70 text-xs sm:text-sm">Nouveau lobby dans <b id="timer"></b> s</div>
            </div>
            <div class="flex-1 min-h-0 flex items-end justify-center">
              ${b.length ? podiumHtml(b, ["h-[20vh]", "h-[14vh]", "h-[10vh]"]) : `<div class="text-xl sm:text-2xl opacity-60 self-center">Aucun joueur cette fois-ci 😢</div>`}
            </div>
            ${(fastRec || streakRec) ? `
              <div class="shrink-0 flex flex-wrap justify-center gap-2">
                ${fastRec ? `<div class="bg-indigo-900/60 border border-cyan-300/40 rounded-full px-3 py-0.5 text-xs sm:text-sm font-bold anim-speed">🚀 Record vitesse : ${esc(fastRec.avatar)} ${esc(fastRec.name)} (${Number(fastRec.time).toFixed(2)}s)</div>` : ""}
                ${streakRec ? `<div class="bg-orange-900/50 border border-amber-300/40 rounded-full px-3 py-0.5 text-xs sm:text-sm font-bold anim-flame">🔥 Meilleure série : ${esc(streakRec.avatar)} ${esc(streakRec.name)} (${streakRec.streak} à la suite)</div>` : ""}
              </div>` : ""}
            ${b.length > 3 ? `<div class="shrink-0 flex flex-wrap justify-center gap-1.5">
              ${b.slice(3, 10).map((p, i) => `<div class="bg-white/10 rounded-xl px-2.5 py-0.5 text-xs"><b class="text-amber-300">${i + 4}.</b> ${esc(p.avatar)} ${esc(p.name)} — ${p.score}</div>`).join("")}
            </div>` : ""}
            <div class="shrink-0 w-full max-w-5xl bg-white/10 border border-amber-300/40 rounded-2xl sm:rounded-3xl p-2.5 sm:p-3.5 flex flex-col items-center gap-2 pop">
              <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-4">
                <span class="text-xs sm:text-sm uppercase tracking-wider opacity-80">Catégorie suivante proposée :</span>
                <button id="btn-next-cat" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-black text-xs sm:text-base px-4 sm:px-5 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl shadow-xl transition active:scale-95">
                  🚀 Enchaîner sur : ${catIcon(s.next_category)} ${esc(s.next_category)}
                </button>
              </div>
              <div id="podium-cats" class="flex flex-wrap justify-center gap-1.5">
                ${cats.map(cat => `
                  <button data-cat="${esc(cat)}" class="podium-cat-btn text-[11px] sm:text-xs font-bold px-2.5 py-1 rounded-xl transition flex items-center gap-1 bg-white/10 hover:bg-white/20">
                    <span>${catIcon(cat)} ${esc(cat)}</span>
                    <span class="podium-cat-meta"></span>
                  </button>`).join("")}

        const nextBtn = $("btn-next-cat");
        if (nextBtn) nextBtn.onclick = () => send("START_NEXT_CATEGORY");
        main.querySelectorAll(".podium-cat-btn").forEach(btn => {
          btn.onclick = () => send("SELECT_CATEGORY", { category: btn.dataset.cat, start: true });

      } else {
        main.innerHTML = `<div class="h-full flex items-center justify-center text-2xl opacity-60">Chargement…</div>`;

    function updateDynamic() {
      const s = state;
      const played = new Set(s.played_categories || []);
      const votes = s.votes || {};
      const voting = !!s.voting_enabled;
      const isBeg = !!s.beginner_mode;
      const bCount = s.beginner_count || 0;
      const bTotal = s.beginner_total || 0;

      // 1. Chrono & barre GPU (transform: scaleX -> zéro reflow)
      setText("timer", fmt(s.timer));
      const bar = $("bar");
      if (bar) bar.style.transform = `scaleX(${Math.max(0, Math.min(1, s.timer / Math.max(1, s.duration)))})`;
      setText("answered", `${s.answered_count} / ${s.players.filter(p => p.connected).length} réponse(s)`);
      setText("btn-speed", `⚡ Vitesse : ${s.speed}x`);
      const speedBadge = $("speed-badge");
      if (speedBadge && speedBadge.classList.contains("hidden") !== (s.speed === 1)) {
        speedBadge.classList.toggle("hidden", s.speed === 1);
      }
      setText("btn-vote", `🗳️ Vote : ${voting ? "ON" : "OFF"}`);
      const voteBadge = $("vote-badge");
      if (voteBadge && voteBadge.classList.contains("hidden") !== !voting) {
        voteBadge.classList.toggle("hidden", !voting);
      }

      const botsCount = s.bots_count || 0;
      const hasBots = botsCount > 0;
      setText("regie-bots-badge", hasBots ? `${botsCount} bots actifs` : "Inactif");
      setText("btn-test-game", hasBots ? "🔄 Relancer Partie test (8 bots)" : "🤖 Partie test (8 bots)");
      const btnTestLobby = $("btn-test-lobby");
      if (btnTestLobby && btnTestLobby.classList.contains("hidden") !== !hasBots) {
        btnTestLobby.classList.toggle("hidden", !hasBots);
      }
      const btnTestStop = $("btn-test-stop");
      if (btnTestStop && btnTestStop.classList.contains("hidden") !== !hasBots) {
        btnTestStop.classList.toggle("hidden", !hasBots);
      }

      const pushSt = s.last_push_status || {};
      const sheetsMsg = !s.sheets_webhook_set
        ? "🟡 Webhook Apps Script non configuré"
        : pushSt.ok === false
          ? `🔴 Erreur synchro : ${pushSt.message || "échec"}`
          : pushSt.ok === true
            ? `🟢 ${pushSt.message || "Synchro OK"}`
            : "🟢 Drive actif (envoi auto fin de partie)";
      setText("sheets-status", sheetsMsg);
      if (typeof s.page_lock_enabled === "boolean" && s.page_lock_enabled !== pageLockEnabled) {
        pageLockEnabled = s.page_lock_enabled;
        syncLockOverlay();
      }
      updatePageLockBtn();

      if (s.pb_config) {
        const pbc = s.pb_config;
        const pbcKey = JSON.stringify({
          store: pbc.store,
          opts: pbc.opts,
          stores: pbc.stores,
        });
        if (!lastPbConfigKey) {
          lastPbConfigKey = pbcKey;
          lastPbRefreshSeq = pbc.refresh_seq || 0;
        } else if (pbcKey !== lastPbConfigKey) {
          lastPbConfigKey = pbcKey;
          const prevStore = pbSelectedStore;
          const prevOrder = pbOpts.order;
          const prevEnabled = pbOpts.enabled;
          if (Array.isArray(pbc.stores) && pbc.stores.length) {
            pbStores = pbc.stores.map(x => ({ name: x.name, url: x.url }));
            saveStoresCookie();
          }
          if (pbc.store && pbStores.some(x => x.name === pbc.store)) {
            pbSelectedStore = pbc.store;
            setCookie("lge_pb_store", pbSelectedStore);
          }
          if (pbc.opts && typeof pbc.opts === "object") {
            pbOpts = {
              enabled: pbc.opts.enabled !== false,
              speedSec: Number(pbc.opts.speedSec) || 4,
              order: pbc.opts.order === "desc" ? "desc" : "asc",
            };
            saveOptsCookie();
          }
          syncStoreSelect();
          if (!$("pb-manage-panel").classList.contains("hidden")) renderStoresEditor();
          pbTrackKey = "";
          if (pbOpts.enabled && (!prevEnabled || prevStore !== pbSelectedStore || prevOrder !== pbOpts.order || !pbPhotos.length)) {
            loadPhotobooth(false);
          } else {
            renderPhotoboothStrip(true);
          }
        }
        if ((pbc.refresh_seq || 0) > lastPbRefreshSeq) {
          lastPbRefreshSeq = pbc.refresh_seq || 0;
          loadPhotobooth(true);
        }
      }

      // 2. Badges de difficulté (uniquement si changement)
      const diffKey = `${s.phase}|${s.difficulty}|${isBeg}|${bCount}|${bTotal}`;
      if (diffKey !== lastDiffKey) {
        lastDiffKey = diffKey;
        const diffBadge = $("diff-badge");
        if (diffBadge) {
          const useBeg = s.phase === "LOBBY" || s.phase === "PODIUM" ? isBeg : s.difficulty === "debutant";
          diffBadge.textContent = useBeg
            ? `🌱 Débutant (${bCount}/${bTotal})`
            : `🔥 Standard (${bCount}/${bTotal})`;
          diffBadge.className = `text-xs font-bold px-2.5 py-0.5 rounded-full ${useBeg ? "bg-emerald-500/25 text-emerald-200 border border-emerald-400/40" : "bg-white/15 text-white"}`;
        }
        const lobbyDiff = $("lobby-diff-badge");
        if (lobbyDiff) {
          lobbyDiff.textContent = isBeg
            ? `🌱 Niveau Débutant (${bCount}/${bTotal} débutants)`
            : `🔥 Niveau Standard (${bCount}/${bTotal} débutants)`;
          lobbyDiff.className = `inline-flex items-center gap-1.5 rounded-full px-4 py-1.5 text-sm font-bold ${isBeg ? "bg-emerald-500/25 text-emerald-200 border border-emerald-400/40" : "bg-white/10 text-white/85"}`;
        }
      }

      // 3. Catégories dans le menu Régie & podium (uniquement si changement)
      const cats = s.categories || [];
      const regieCats = $("regie-cats");
      const cKey = cats.join("|");
      if (regieCats && cKey !== regieCatsKey) {
        regieCatsKey = cKey;
        lastCatsStateKey = "";
        regieCats.innerHTML = cats.map(cat => `
          <button data-cat="${esc(cat)}" class="cat-btn rounded-xl px-3 py-2 text-xs font-bold transition bg-white/10 hover:bg-white/20 flex items-center justify-between gap-2 text-left">
            <span>${catIcon(cat)} ${esc(cat)}</span>
            <span class="cat-meta text-[11px]"></span>
          </button>`).join("");
        regieCats.querySelectorAll(".cat-btn").forEach(btn => {
          btn.onclick = () => send("SELECT_CATEGORY", { category: btn.dataset.cat });
        });
      }
      setText("lobby-cat-name", `${catIcon(s.category)} ${s.category || ""}`);
      setText("regie-vote-hint", voting ? "🗳️ Vote joueurs actif" : "Sélection régie");
      if (s.phase === "LOBBY") renderPhotoboothStrip(false);

      const catsStateKey = `${s.category}|${s.next_category}|${voting}|${(s.played_categories || []).join(",")}|${cats.map(c => votes[c] || 0).join(",")}`;
      if (catsStateKey !== lastCatsStateKey) {
        lastCatsStateKey = catsStateKey;
        document.querySelectorAll(".cat-btn").forEach(btn => {
          const cat = btn.dataset.cat;
          const active = cat === s.category;
          const locked = played.has(cat);
          const vCount = votes[cat] || 0;
          btn.disabled = voting && locked;
          btn.classList.toggle("bg-amber-400", active);
          btn.classList.toggle("text-slate-900", active);
          btn.classList.toggle("ring-2", active);
          btn.classList.toggle("ring-amber-200", active);
          btn.classList.toggle("bg-white/10", !active);
          btn.classList.toggle("hover:bg-white/20", !active && !(voting && locked));
          btn.classList.toggle("opacity-40", locked && !active);
          const meta = btn.querySelector(".cat-meta");
          if (meta) {
            meta.textContent = locked ? "🔒 Déjà jouée" : (voting ? `🗳️ ${vCount}` : "");
          }
        });
        const nextBtn = $("btn-next-cat");
        if (nextBtn) {
          nextBtn.textContent = `🚀 Enchaîner sur : ${catIcon(s.next_category)} ${s.next_category}`;
        }
        document.querySelectorAll(".podium-cat-btn").forEach(btn => {
          const cat = btn.dataset.cat;
          const isNext = cat === s.next_category;
          const locked = played.has(cat);
          const vCount = votes[cat] || 0;
          btn.disabled = voting && locked;
          btn.className = `podium-cat-btn text-xs font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 ${
            isNext ? "bg-amber-400/25 border border-amber-300 text-amber-200"
            : locked ? "bg-white/5 text-white/40 cursor-not-allowed"
            : "bg-white/10 hover:bg-white/20 text-white/85"
          }`;
          const meta = btn.querySelector(".podium-cat-meta");
          if (meta) {
            meta.textContent = locked ? "🔒" : (voting ? `🗳️ ${vCount}` : (isNext ? "(suivante)" : ""));
          }
        });
      }

      // 4. Mini QR permanent hors lobby
      const wrap = $("mini-qr-wrap");
      const showMini = s.phase !== "LOBBY" && roomCode;
      if (wrap.classList.contains("hidden") !== !showMini) {
        wrap.classList.toggle("hidden", !showMini);
        wrap.classList.toggle("flex", !!showMini);
      }
      if (roomCode && miniQrFor !== roomCode) {
        miniQrFor = roomCode;
        const box = $("mini-qr");
        box.innerHTML = "";
        new QRCode(box, { text: joinUrl(), width: 256, height: 256, colorDark: "#1e1b4b", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
        setText("mini-code", roomCode);
      }

      // 5. Liste des joueurs (Lobby + Régie) — reconstruite uniquement si changement réel
      const playersKey = s.players.map(p => `${p.id}:${p.name}:${p.avatar}:${p.connected ? 1 : 0}:${p.beginner ? 1 : 0}:${p.missed_streak || 0}`).join("|");
      if (playersKey !== lastPlayersKey) {
        lastPlayersKey = playersKey;
        const hasPlayers = s.players.length > 0;
        const lobbyGrid = $("lobby-grid");
        if (lobbyGrid) {
          lobbyGrid.classList.toggle("md:grid-cols-2", hasPlayers);
          lobbyGrid.classList.toggle("grid-cols-1", !hasPlayers);
        }
        const lobbyPlayersCol = $("lobby-players-col");
        if (lobbyPlayersCol) {
          lobbyPlayersCol.classList.toggle("hidden", !hasPlayers);
          lobbyPlayersCol.classList.toggle("flex", hasPlayers);
        }
        const lobbyCta = $("lobby-cta");
        if (lobbyCta) {
          lobbyCta.className = `cta-breathe ${hasPlayers ? "text-[clamp(1.65rem,4.6vh,3.4rem)]" : "text-[clamp(2.3rem,6.4vh,4.8rem)]"} font-black tracking-tight text-amber-300 leading-none`;
        }
        const bigQrWrap = $("big-qr-wrap");
        if (bigQrWrap) {
          bigQrWrap.className = `bg-white p-2.5 sm:p-3.5 rounded-2xl sm:rounded-3xl shadow-2xl ${hasPlayers ? "w-[clamp(120px,24vh,235px)]" : "w-[clamp(155px,30vh,295px)]"}`;
        }
        const list = $("player-list");
        if (list) {
          setText("player-count", `(${s.players.length})`);
          list.innerHTML = s.players.length ? s.players.map(p => `
            <div class="bg-white/10 rounded-2xl px-4 py-3 flex items-center gap-3 ${p.connected ? "" : "opacity-40"}">
              <span class="text-4xl">${esc(p.avatar)}</span>
              <span class="text-xl font-semibold truncate flex-1">${esc(p.name)}</span>
              ${p.beginner ? `<span title="Débutant" class="text-sm bg-emerald-500/25 text-emerald-200 rounded-full px-2 py-0.5">🌱</span>` : ""}
              <span class="w-2.5 h-2.5 rounded-full ${p.connected ? "bg-emerald-400" : "bg-slate-500"}"></span>
            </div>`).join("")
            : `<div class="col-span-full text-xl opacity-60">En attente des premiers joueurs…</div>`;
        }
        const regiePlayers = $("regie-players");
        if (regiePlayers) {
          setText("regie-player-count", `(${s.players.length})`);
          regiePlayers.innerHTML = s.players.length ? s.players.map(p => `
            <div class="bg-white/5 rounded-xl px-2.5 py-1.5 flex items-center gap-2 text-xs">
              <span class="w-2 h-2 rounded-full ${p.connected ? "bg-emerald-400" : "bg-rose-400"}"></span>
              <span class="text-base">${esc(p.avatar)}</span>
              <span class="flex-1 font-semibold truncate">${esc(p.name)}</span>
              ${p.missed_streak > 0 ? `<span class="text-[10px] bg-amber-500/20 text-amber-200 rounded px-1.5 py-0.5">⚠️ ${p.missed_streak}/5</span>` : ""}
              <button data-kick="${esc(p.id)}" title="Retirer de la salle" class="kick-btn bg-rose-600/80 hover:bg-rose-600 text-white rounded-lg px-2 py-0.5 font-bold">✕</button>
            </div>`).join("")
            : `<div class="text-xs opacity-50">Aucun joueur connecté</div>`;
          regiePlayers.querySelectorAll(".kick-btn").forEach(btn => {
            btn.onclick = () => send("KICK_PLAYER", { player_id: btn.dataset.kick });
          });
        }
      }
    }

    function fireConfetti(ms = 6000) {
      stopConfetti();
      if (typeof confetti !== "function") return;
      const end = Date.now() + ms;
      confetti({ particleCount: ms > 3000 ? 180 : 100, spread: 100, origin: { y: 0.6 } });
      confettiTimer = setInterval(() => {
        if (Date.now() > end) return stopConfetti();
        confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0 } });
        confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1 } });
      }, 120);
    }
    function stopConfetti() { if (confettiTimer) { clearInterval(confettiTimer); confettiTimer = null; } }
  }

  /* ======================================================================
   *  MODE PARTICIPANT (mobile)
   * ==================================================================== */
  function initPlayer() {
    const code = ROOM_PARAM;
    let pid = localStorage.getItem("qal_player_id");
    if (!pid) {
      pid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().replace(/-/g, "")
          : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
      localStorage.setItem("qal_player_id", pid);
    }
    let profile = null;
    try { profile = JSON.parse(localStorage.getItem("qal_profile") || "null"); } catch (_) {}
    let selectedAvatar = (profile && profile.avatar) || AVATARS[Math.floor(Math.random() * AVATARS.length)];
    let selectedBeginner = !!(profile && profile.beginner);
    let selectedVote = "";
    let manualJoinRequired = false;
    let kickedReason = "";
    let ws = null, state = null, lastKey = "", joinSent = false, pendingChoice = null, celebrated = "", editing = false;

    app.innerHTML = `
      <div class="h-[100dvh] flex flex-col max-w-xl mx-auto">
        <header class="flex items-center justify-between px-4 py-3 border-b border-white/10 gap-2">
          <div class="flex items-center gap-2 shrink-0">
            <img src="${LOGO_URL}" alt="Laser Game Evolution" class="h-8 w-auto object-contain" />
            <div class="font-black text-lg">Laser <span class="text-amber-300">Quiz</span></div>
          </div>
          <div id="me" class="flex items-center gap-1.5 text-sm min-w-0"></div>
          <div class="text-xs bg-white/10 rounded-full px-2 py-1 font-mono shrink-0">${esc(code || "?????")}</div>
        </header>
        <main id="pl-main" class="flex-1 min-h-0 p-4 flex flex-col overflow-y-auto"></main>
        <footer id="pl-footer" class="hidden px-4 pb-3 pt-2 border-t border-white/10 shrink-0">
          <div class="flex justify-center">
            <button id="btn-leave" class="text-xs bg-rose-600/80 hover:bg-rose-600 rounded-full px-4 py-1.5 font-bold">🚪 Quitter la partie</button>
          </div>
        </footer>
      </div>`;

    $("btn-leave").onclick = () => {
      manualJoinRequired = true;
      kickedReason = "";
      editing = false;
      pendingChoice = null;
      sendMsg({ type: "LEAVE" });
      if (state) {
        state.joined = false;
        render();
      }
    };

    if (code.length !== 5) { showError("Code de salle invalide. Scannez à nouveau le QR code affiché sur la TV."); return; }

    function connect() {
      ws = new WebSocket(`${WS_BASE}/ws/player/${code}/${pid}`);
      ws.onopen = () => { joinSent = false; };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "error") {
          if (!state || !state.joined) showError(msg.message);
          return;
        }
        if (msg.type === "kicked") {
          manualJoinRequired = true;
          kickedReason = msg.reason || "Tu as été retiré de la partie.";
          editing = false;
          pendingChoice = null;
          if (state) {
            state.joined = false;
            lastKey = "";
            render();
          }
          return;
        }
        if (msg.type !== "state") return;
        state = msg;
        if (!state.joined && profile && profile.name && !joinSent && !manualJoinRequired) {
          joinSent = true;
          sendMsg({ type: "JOIN", name: profile.name, avatar: profile.avatar, beginner: !!profile.beginner });
        }
        if (state.joined) {
          selectedBeginner = !!state.my_beginner;
          manualJoinRequired = false;
        }
        if (state.phase !== "QUESTION" || state.my_answer !== null) pendingChoice = null;
        render();
      };
      ws.onclose = () => setTimeout(connect, 2500);
    }
    function sendMsg(o) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(o)); }
    connect();

    function showError(message) {
      lastKey = "error";
      $("pl-main").innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-center text-center gap-4">
          <div class="text-6xl">😕</div>
          <div class="text-xl font-bold">${esc(message)}</div>
          <div class="text-sm opacity-60 pulse-soft">Nouvelle tentative automatique…</div>
        </div>`;
    }

    function render() {
      const s = state;
      $("me").innerHTML = s.joined
        ? `<span class="text-xl">${esc(s.avatar)}</span><span class="font-semibold max-w-[6.5rem] truncate">${esc(s.name)}</span><span class="bg-amber-400 text-slate-900 font-bold rounded-full px-2">${s.score}</span>`
        : "";
      $("pl-footer").classList.toggle("hidden", !s.joined);
      const answered = s.my_answer !== null || pendingChoice !== null;
      const key = (!s.joined || editing)
        ? `join|${!!s.voting_enabled}|${kickedReason}`
        : (s.phase === "LOBBY" || s.phase === "PODIUM")
          ? `${s.phase}|${s.q_index}|${!!s.voting_enabled}`
          : `${s.phase}|${s.q_index}|${answered}`;
      if (key !== lastKey) { lastKey = key; buildView(); }
      updatePlayerDynamic();
    }

    function updatePlayerDynamic() {
      const s = state;
      setText("pl-timer", fmt(s.timer));
      setText("pl-count", s.players_count);
      setText("pl-cat", `${catIcon(s.category)} ${s.category || ""}`);
      setText("pl-next-cat", `${catIcon(s.next_category)} ${s.next_category || ""}`);

      const bCount = s.beginner_count || 0;
      const bTotal = s.beginner_total || 0;
      setText("pl-diff-info", s.beginner_mode
        ? `🌱 Niveau Débutant actif (${bCount}/${bTotal} débutants)`
        : `🔥 Niveau Standard (${bCount}/${bTotal} débutants)`);

      const begCb = $("pl-beginner");
      if (begCb) begCb.checked = !!s.my_beginner;

      const played = new Set(s.played_categories || []);
      const votes = s.votes || {};
      document.querySelectorAll(".pl-vote-btn").forEach(btn => {
        const cat = btn.dataset.cat;
        const locked = played.has(cat);
        const mine = s.joined && !editing ? (s.my_vote === cat) : (selectedVote === cat);
        const vCount = votes[cat] || 0;
        btn.disabled = locked;
        btn.className = `pl-vote-btn rounded-xl px-3 py-2 text-xs font-bold transition flex items-center justify-between gap-2 ${
          locked ? "bg-white/5 text-white/35 cursor-not-allowed"
          : mine ? "bg-amber-400 text-slate-900 ring-2 ring-amber-200"
          : "bg-white/10 active:scale-95 text-white"
        }`;
        const meta = btn.querySelector(".pl-vote-meta");
        if (meta) meta.textContent = locked ? "🔒" : `🗳️ ${vCount}`;
      });
    }

    function voteSectionHtml(s) {
      if (!s.voting_enabled) return "";
      const cats = s.categories || [];
      return `
        <div class="w-full bg-white/10 border border-white/15 rounded-2xl p-3 text-left">
          <div class="text-xs uppercase opacity-75 mb-2 font-bold">🗳️ Vote pour la catégorie</div>
          <div class="grid grid-cols-1 gap-1.5">
            ${cats.map(cat => `
              <button type="button" data-cat="${esc(cat)}" class="pl-vote-btn rounded-xl px-3 py-2 text-xs font-bold transition flex items-center justify-between gap-2 bg-white/10">
                <span>${catIcon(cat)} ${esc(cat)}</span>
                <span class="pl-vote-meta"></span>
              </button>`).join("")}
          </div>
        </div>`;
    }

    function bindVoteButtons(root, onPick) {
      root.querySelectorAll(".pl-vote-btn").forEach(btn => {
        btn.onclick = () => {
          if (btn.disabled) return;
          onPick(btn.dataset.cat);
        };
      });
    }

    function beginnerToggleHtml(s) {
      return `
        <label class="w-full flex items-center gap-3 bg-white/10 border border-white/15 rounded-2xl px-4 py-2.5 cursor-pointer">
          <input id="pl-beginner" type="checkbox" class="w-5 h-5 accent-amber-400" ${s.my_beginner ? "checked" : ""} />
          <div class="text-left flex-1">
            <div class="text-sm font-bold">🌱 Mode Débutant</div>
            <div id="pl-diff-info" class="text-xs opacity-75"></div>
          </div>
        </label>`;
    }

    function bindBeginnerToggle() {
      const cb = $("pl-beginner");
      if (cb) {
        cb.onchange = () => {
          selectedBeginner = cb.checked;
          if (profile) {
            profile.beginner = selectedBeginner;
            localStorage.setItem("qal_profile", JSON.stringify(profile));
          }
          sendMsg({ type: "VOTE", beginner: selectedBeginner });
        };
      }
    }

    function buildView() {
      const s = state, main = $("pl-main");

      if (!s.joined || editing) {
        main.innerHTML = `
          <div class="flex-1 flex flex-col gap-4 justify-center pop py-2">
            <div class="flex justify-center">
              <img src="${LOGO_URL}" alt="Laser Game Evolution" class="h-12 w-auto object-contain" />
            </div>
            <h1 class="text-3xl font-black text-center">Rejoins la partie !</h1>
            ${kickedReason ? `<div class="bg-amber-400/20 border border-amber-300/40 text-amber-200 rounded-2xl px-4 py-2.5 text-sm font-semibold text-center">${esc(kickedReason)}</div>` : ""}
            <div>
              <div class="text-sm uppercase opacity-70 mb-2">Choisis ton avatar</div>
              <div id="avatars" class="grid grid-cols-8 gap-2">
                ${AVATARS.map(a => `<button data-a="${a}" class="avatar text-3xl aspect-square rounded-xl bg-white/10 transition ${a === selectedAvatar ? "ring-4 ring-amber-300 bg-white/25 scale-110" : ""}">${a}</button>`).join("")}
              </div>
            </div>
            <div>
              <div class="text-sm uppercase opacity-70 mb-2">Ton pseudo</div>
              <input id="name" maxlength="16" autocomplete="off" placeholder="Ex : Super Quizzeur"
                class="w-full rounded-2xl bg-white text-slate-900 text-xl font-bold px-4 py-3.5 outline-none focus:ring-4 ring-amber-300"
                value="${esc((profile && profile.name) || "")}" />
            </div>
            <label class="flex items-center gap-3 bg-white/10 border border-white/15 rounded-2xl px-4 py-3 cursor-pointer">
              <input id="join-beginner" type="checkbox" class="w-6 h-6 accent-amber-400" ${selectedBeginner ? "checked" : ""} />
              <div class="text-left">
                <div class="font-bold text-base">🌱 Débutant</div>
                <div class="text-xs opacity-75">Questions plus faciles si &gt; 50 % des joueurs cochent Débutant</div>
              </div>
            </label>
            ${voteSectionHtml(s)}
            <button id="join" class="w-full rounded-2xl bg-amber-400 text-slate-900 text-2xl font-black py-4 shadow-xl active:scale-95 transition">C'est parti ! 🚀</button>
            <div id="join-err" class="text-center text-rose-300 h-5"></div>
          </div>`;
        main.querySelectorAll(".avatar").forEach(btn => btn.onclick = () => {
          selectedAvatar = btn.dataset.a;
          main.querySelectorAll(".avatar").forEach(b => b.classList.remove("ring-4", "ring-amber-300", "bg-white/25", "scale-110"));
          btn.classList.add("ring-4", "ring-amber-300", "bg-white/25", "scale-110");
        });
        $("join-beginner").onchange = (e) => { selectedBeginner = e.target.checked; };
        bindVoteButtons(main, (cat) => {
          selectedVote = cat;
          updatePlayerDynamic();
        });
        const doJoin = () => {
          const name = $("name").value.trim();
          if (!name) { setText("join-err", "Entre un pseudo 🙂"); return; }
          selectedBeginner = $("join-beginner").checked;
          profile = { name, avatar: selectedAvatar, beginner: selectedBeginner };
          localStorage.setItem("qal_profile", JSON.stringify(profile));
          joinSent = true;
          editing = false;
          manualJoinRequired = false;
          kickedReason = "";
          const payload = { type: "JOIN", name, avatar: selectedAvatar, beginner: selectedBeginner };
          if (selectedVote) payload.vote_category = selectedVote;
          sendMsg(payload);
          $("join").disabled = true;
          $("join").textContent = "Connexion…";
        };
        $("join").onclick = doJoin;
        $("name").onkeydown = (e) => { if (e.key === "Enter") doJoin(); };
        return;
      }

      if (s.phase === "LOBBY") {
        main.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center text-center gap-3 pop py-2">
            <div class="text-7xl">${esc(s.avatar)}</div>
            <div class="text-2xl font-black">Bienvenue ${esc(s.name)} !</div>
            <div id="pl-cat" class="bg-amber-400/20 border border-amber-300/40 text-amber-200 rounded-full px-4 py-1.5 text-sm font-bold"></div>
            <div class="bg-white/10 rounded-3xl px-8 py-3">
              <div class="text-xs uppercase opacity-70">La partie commence dans</div>
              <div id="pl-timer" class="text-5xl font-black font-mono"></div>
            </div>
            <div class="text-sm opacity-75"><span id="pl-count"></span> joueur(s) dans la salle</div>
            ${beginnerToggleHtml(s)}
            ${voteSectionHtml(s)}
            <button id="edit" class="text-sm underline opacity-60 mt-1">Modifier mon profil</button>
          </div>`;
        $("edit").onclick = () => { editing = true; render(); };
        bindBeginnerToggle();
        bindVoteButtons(main, (cat) => sendMsg({ type: "VOTE", category: cat }));
        return;
      }

      if (s.phase === "QUESTION") {
        const mine = s.my_answer !== null ? s.my_answer : pendingChoice;
        if (mine === null) {
          main.innerHTML = `
            <div class="flex items-center justify-between mb-3">
              <span class="text-sm opacity-80">Question ${s.q_index + 1}/${s.q_total}</span>
              <span id="pl-timer" class="text-2xl font-black bg-white/10 rounded-full w-12 h-12 flex items-center justify-center"></span>
            </div>
            ${s.question ? `<div class="text-center font-bold text-lg mb-3 leading-snug">${esc(s.question.q)}</div>` : ""}
            <div class="flex-1 grid grid-cols-2 grid-rows-2 gap-3">
              ${[0, 1, 2, 3].map(i => `
                <button data-c="${i}" class="answer-btn ${COLORS[i]} rounded-3xl flex flex-col items-center justify-center gap-2 shadow-xl transition p-2">
                  <span class="text-7xl drop-shadow">${SHAPES[i]}</span>
                  ${s.question ? `<span class="text-sm font-semibold leading-tight">${esc(s.question.options[i])}</span>` : ""}
                </button>`).join("")}
            </div>`;
          main.querySelectorAll(".answer-btn").forEach(btn => btn.onclick = () => {
            const c = Number(btn.dataset.c);
            pendingChoice = c;
            main.querySelectorAll(".answer-btn").forEach(b => b.disabled = true);
            if (navigator.vibrate) navigator.vibrate(40);
            sendMsg({ type: "ANSWER", choice: c });
            render();
          });
        } else {
          main.innerHTML = `
            <div class="flex-1 flex flex-col items-center justify-center text-center gap-5 pop">
              <div class="${COLORS[mine]} w-40 h-40 rounded-3xl flex items-center justify-center text-8xl shadow-2xl">${SHAPES[mine]}</div>
              <div class="text-2xl font-black">🔒 Réponse verrouillée</div>
              <div class="opacity-70 pulse-soft">En attente des autres joueurs…</div>
              <div class="opacity-60">⏱ <span id="pl-timer"></span> s</div>
            </div>`;
        }
        return;
      }

      if (s.phase === "REVEAL") {
        const ans = s.question ? s.question.answer : null;
        const noAnswer = s.my_answer === null;
        const ok = s.last_correct === true;
        const bg = ok ? "bg-emerald-600" : (noAnswer ? "bg-slate-700" : "bg-rose-600");
        const myEvents = (s.round_events || []).filter(ev => ev.player_id === pid);
        const streakChip = s.my_correct_streak >= 15 ? `<div class="bg-amber-300 text-slate-950 font-black rounded-full px-4 py-1 text-sm anim-flame">👑 15 à la suite — Sans-Faute !</div>`
          : s.my_correct_streak >= 10 ? `<div class="bg-fuchsia-600 text-white font-black rounded-full px-4 py-1 text-sm anim-flame">⚡ Série Légendaire (${s.my_correct_streak} !)</div>`
          : s.my_correct_streak >= 5 ? `<div class="bg-orange-500 text-white font-black rounded-full px-4 py-1 text-sm anim-flame">🔥 Série en Feu (${s.my_correct_streak} !)</div>`
          : s.my_correct_streak >= 2 ? `<div class="bg-black/25 rounded-full px-3 py-1 text-xs font-bold">🔥 Série : ${s.my_correct_streak} d'affilée</div>`
          : s.my_wrong_streak >= 5 ? `<div class="bg-cyan-700 text-white font-black rounded-full px-4 py-1 text-sm anim-ice">🧊 Coup de Froid (${s.my_wrong_streak} erreurs)</div>` : "";
        main.innerHTML = `
          <div class="flex-1 ${bg} rounded-3xl flex flex-col items-center justify-center text-center gap-3 p-5 pop">
            <div class="text-6xl">${ok ? "✅" : (noAnswer ? "⏱️" : "❌")}</div>
            <div class="text-3xl font-black">${ok ? "Bonne réponse !" : (noAnswer ? "Temps écoulé !" : "Raté !")}</div>
            <div class="text-5xl font-black">+${s.last_points}</div>
            ${streakChip}
            ${myEvents.length ? `<div class="flex flex-wrap justify-center gap-1.5">${myEvents.map(ev => `<span class="bg-black/30 border border-white/25 rounded-full px-3 py-1 text-xs font-bold anim-event">${esc(ev.icon)} ${esc(ev.title)}</span>`).join("")}</div>` : ""}
            ${ans !== null ? `<div class="flex items-center gap-3 bg-black/20 rounded-2xl px-4 py-3">
              <span class="${COLORS[ans]} w-12 h-12 rounded-xl flex items-center justify-center text-3xl">${SHAPES[ans]}</span>
              <span class="text-left font-semibold">${esc(s.question.options[ans])}</span></div>` : ""}
            <div class="mt-1 text-lg">Score : <b>${s.score}</b> pts · ${s.rank ? `<b>${s.rank}<sup>${s.rank === 1 ? "er" : "e"}</sup></b> / ${s.players_count}` : ""}</div>
          </div>`;
        if (ok && navigator.vibrate) navigator.vibrate([60, 40, 60]);
        return;
      }

      if (s.phase === "INTER_PODIUM") {
        const b = s.top3 || [];
        const miniStep = (p, place, medal, h, color, cls) => p ? `
          <div class="flex flex-col items-center justify-end podium-step ${cls} w-24">
            <div class="text-3xl podium-avatar">${esc(p.avatar)}</div>
            <div class="text-xs font-bold truncate w-full text-center">${esc(p.name)}</div>
            <div class="text-[11px] text-amber-200 mb-1">${p.score}</div>
            <div class="${color} ${h} w-full rounded-t-xl flex flex-col items-center pt-1.5 font-black shadow-lg">
              <span class="text-lg leading-none">${medal}</span>
              <span class="text-base">${place}</span>
            </div>
          </div>` : `<div class="w-24"></div>`;
        main.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center text-center gap-4 pop">
            <div class="bg-amber-400/20 border border-amber-300/40 text-amber-200 rounded-full px-4 py-1 text-sm font-bold">
              ⚡ Point d'étape · ${s.q_index + 1} / ${s.q_total}
            </div>
            <div class="text-xl">
              Tu es <b class="text-amber-300 text-2xl">${s.rank ? `${s.rank}<sup>${s.rank === 1 ? "er" : "e"}</sup>` : "-"}</b> / ${s.players_count} · <b>${s.score} pts</b>
            </div>
            <div class="flex items-end justify-center gap-2 mt-2">
              ${miniStep(b[1], "2", "🥈", "h-20", "bg-slate-300 text-slate-800", "podium-2")}
              ${miniStep(b[0], "1", "🥇", "h-28", "bg-amber-400 text-slate-900 podium-shine", "podium-1")}
              ${miniStep(b[2], "3", "🥉", "h-14", "bg-orange-700 text-white", "podium-3")}
            </div>
            <div class="opacity-70 text-sm mt-2">Reprise du quiz dans <b id="pl-timer" class="text-amber-300 text-base"></b> s</div>
          </div>`;
        return;
      }

      if (s.phase === "PODIUM") {
        const medal = { 1: "🥇", 2: "🥈", 3: "🥉" }[s.rank] || "🎉";
        const badges = s.my_badges || [];
        const rankLabel = s.rank ? `${s.rank}${s.rank === 1 ? "er" : "e"}` : "-";
        const shareText = `${medal} J'ai terminé ${rankLabel}/${s.players_count} au Laser Quiz (${s.category}) avec ${s.score} pts !${s.my_best_streak >= 3 ? ` 🔥 Série max : ${s.my_best_streak}` : ""}${s.my_fastest_time ? ` 🚀 Éclair : ${Number(s.my_fastest_time).toFixed(2)}s` : ""}`;
        const shareUrl = window.location.origin;

        main.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center text-center gap-3 pop py-2">
            <div class="text-6xl">${medal}</div>
            <div class="text-lg opacity-80">Tu termines</div>
            <div class="text-5xl font-black">${s.rank ? `${s.rank}<sup class="text-2xl">${s.rank === 1 ? "er" : "e"}</sup>` : "-"}</div>
            <div class="text-base">sur ${s.players_count} avec <b class="text-amber-300">${s.score} pts</b></div>
            ${(badges.length || s.my_best_streak >= 2 || s.my_fastest_time) ? `
              <div class="w-full bg-white/10 rounded-2xl p-2.5 flex flex-wrap justify-center gap-1.5">
                ${s.my_best_streak >= 2 ? `<span class="bg-orange-500/30 border border-orange-300/40 rounded-full px-2.5 py-0.5 text-xs font-bold">🔥 Série max : ${s.my_best_streak}</span>` : ""}
                ${s.my_fastest_time ? `<span class="bg-cyan-500/25 border border-cyan-300/40 rounded-full px-2.5 py-0.5 text-xs font-bold">🚀 Plus rapide : ${Number(s.my_fastest_time).toFixed(2)}s</span>` : ""}
                ${badges.map(b => `<span class="bg-amber-400/20 border border-amber-300/40 rounded-full px-2.5 py-0.5 text-xs font-bold">${esc(b.icon)} ${esc(b.label)}</span>`).join("")}
              </div>` : ""}
            <div class="w-full bg-white/10 rounded-2xl p-3 text-left">
              ${s.top3.map((p, i) => `<div class="flex items-center gap-3 py-1"><span>${["🥇", "🥈", "🥉"][i]}</span><span class="text-2xl">${esc(p.avatar)}</span><span class="flex-1 truncate font-semibold">${esc(p.name)}</span><b>${p.score}</b></div>`).join("")}
            </div>
            <div class="w-full bg-indigo-950/60 border border-white/15 rounded-2xl p-3 flex flex-col gap-2">
              <div class="text-xs uppercase tracking-wider opacity-75 font-bold">📣 Partager mon score</div>
              <button id="share-native" class="w-full rounded-xl bg-gradient-to-r from-amber-400 to-orange-400 text-slate-950 font-black py-2.5 text-sm shadow active:scale-95 transition">
                📲 Partager / Story (Image + Texte)
              </button>
              <div class="grid grid-cols-4 gap-1.5 text-xs font-bold">
                <a target="_blank" rel="noopener" data-share="x" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}" class="share-link-btn bg-black/60 hover:bg-black/80 rounded-xl py-2 flex items-center justify-center">𝕏</a>
                <a target="_blank" rel="noopener" data-share="facebook" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}&quote=${encodeURIComponent(shareText)}" class="share-link-btn bg-blue-600/80 hover:bg-blue-600 rounded-xl py-2 flex items-center justify-center">📘 FB</a>
