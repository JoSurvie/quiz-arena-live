name: Security & Vulnerability Check

on:
  push:
    branches: ["main", "merge-photobooth"]
  pull_request:
    branches: ["main", "merge-photobooth"]
  schedule:
    # Tous les lundis à 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit des dépendances (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Vérifier les vulnérabilités connues (PyPI / OSV)
        run: pip-audit -r requirements.txt --strict --desc on

  code-scan:
    name: Analyse statique du code (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Bandit
        run: pip install bandit

      - name: Scanner server.py (sévérité moyenne et haute)
        run: bandit -r server.py -ll -ii

  compile-check:
    name: Vérification de compilation Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: py_compile
        run: python -m py_compile server.py
