version: 2
updates:
  # Dépendances Python (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "merge-photobooth"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions GitHub utilisées dans .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "merge-photobooth"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
